# Пул случайного режима для «Аксиомы».
#
# Апстримовый Secret (Resources/Prototypes/secret_weights.yml) не трогаем: он остаётся как есть,
# а сервер переключается на этот пул через CVar game.secret_weight_prototype в config.toml.
# Так правка не конфликтует при подтягивании апстрима и снимается одной строкой конфига.
#
# Три режима, решение владельца 23.08.2026. Раньше стоял жёсткий RogueAiOpen каждый раунд;
# смысл смены — чтобы вечер не был предсказуем с первой минуты, но при этом не выпадали
# Nukeops, Zombie, Revolutionary и Survival, ради которых сервер не существует.
#
# Веса равные. Оснований предпочесть один другому нет: замеров, какой режим на этом онлайне
# играется лучше, никто не делал, а выдумывать перекос без данных — значит закрепить догадку.
#
# ВАЖНО про Traitor: у его правила minPlayers = 2 (GameRules/roundstart.yml), и
# SecretRuleSystem.CanPick отсеивает его, когда готовых игроков меньше двух. На онлайне 0-1
# пул фактически вырождается в два режима злого ИИ — это не поломка, а работающий фильтр:
# предатель в одиночку не играется. Обратный случай тоже верен: оба режима ИИ minPlayers не
# задают, то есть выпадают при любом онлайне.
#
# ЧЕТВЁРТЫЙ РЕЖИМ, 01.09.2026: AiPeaceful. До него «мирная смена» в пуле означала Traitor, а в
# таком раунде киборга нет вовсе — спавнит их правило режима, а у предателя нашего правила нет.
# AiPeaceful даёт ту же обычную смену, но с живым силиконом: ИИ со штатными законами и один
# инженерный киборг. Вес равный остальным по той же причине, что и у прочих: замеров нет.
- type: weightedRandom
  id: SecretAksioma
  weights:
    Traitor: 1.0
    AiPeaceful: 1.0
    RogueAiHidden: 1.0
    RogueAiOpen: 1.0
