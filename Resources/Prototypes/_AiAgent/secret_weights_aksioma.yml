# Пул случайного режима для «Аксиомы».
#
# Апстримовый Secret (Resources/Prototypes/secret_weights.yml) не трогаем: он остаётся как есть,
# а сервер переключается на этот пул через CVar game.secret_weight_prototype в config.toml.
# Так правка не конфликтует при подтягивании апстрима и снимается одной строкой конфига.
#
# ДВА РЕЖИМА, решение владельца 02.09.2026: Traitor и AiPeaceful.
#
# Оба злых режима — RogueAiHidden и RogueAiOpen — выведены из пула. Не удалены: пресеты, правила,
# лоусеты и файлы личности остаются на месте и запускаются вручную (`forcepreset RogueAiOpen`) или
# возвращаются в пул одной строкой здесь. Из ротации ушла только СЛУЧАЙНОСТЬ их выпадения.
#
# История пула: жёсткий RogueAiOpen каждый раунд → три режима 23.08.2026 (чтобы вечер не был
# предсказуем с первой минуты, но не выпадали Nukeops, Zombie, Revolutionary и Survival, ради
# которых сервер не существует) → четвёртым 01.09.2026 добавлен AiPeaceful → сегодняшние два.
#
# Веса равные. Оснований предпочесть один другому нет: замеров, какой режим на этом онлайне
# играется лучше, никто не делал, а выдумывать перекос без данных — значит закрепить догадку.
#
# ВАЖНО ПРО ПУСТОЙ СЕРВЕР, И ЭТО ГЛАВНОЕ ПОСЛЕДСТВИЕ СЕГОДНЯШНЕЙ ПРАВКИ. У Traitor
# minPlayers = 2 (GameRules/roundstart.yml), и SecretRuleSystem.CanPick отсеивает его, когда
# готовых игроков меньше двух. Пока в пуле были три режима ИИ без порога, на онлайне 0-1 пул
# просто вырождался в них. Теперь весь запас — это ОДИН AiPeaceful: он порога не задаёт и потому
# остаётся единственным выпадающим режимом на пустом и почти пустом сервере.
#
# Отсюда правило на будущее: убирая AiPeaceful из пула, проверьте, что в нём остался хоть один
# режим без minPlayers. Пул, у всех режимов которого есть порог, на пустом сервере не выбирает
# ничего, и раунд не начинается вовсе — молча, без строки в журнале. Это и было причиной завести
# свой пул вместо апстримового. Сторожит SecretPoolTests.Pool_StaysPickableOnAnEmptyServer.
- type: weightedRandom
  id: SecretAksioma
  weights:
    Traitor: 1.0
    AiPeaceful: 1.0
