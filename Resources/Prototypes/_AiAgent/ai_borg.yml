# Шасси борга, которое ведёт языковая модель.
#
# Наследуется от инженерного борга не по вкусу, а по задаче: у типа `engineering` в
# borg_types.yml стоят ровно те модули, которыми делают работу на станции — Prying, Tool,
# Construction, RCD, Cable. Робот без них умеет ходить и разговаривать, то есть не умеет
# ничего из того, ради чего ему дали тело.
#
# Батарея вставлена прототипом намеренно. Без заряда `SharedBorgSystem.CanActivate` не пускает
# шасси в активное состояние, а неактивное шасси — это отсутствие модулей (то есть рук) и
# отсутствие доступа по ID. Пустой слот означал бы, что робот при спавне выглядит рабочим и
# молча не может ничего.

- type: entity
  id: AiBorgChassis
  parent: BorgChassisEngineer
  name: инженерный киборг «Сегмент»
  description: Кибернетический корпус под управлением станционной нейросети. Отвечает сам за себя.
  components:
  - type: AiBorg
    agentId: borg-1
    agentName: Сегмент
    soulFile: SOUL.md
    autoClaim: true
    # Своя цепочка, не общая с ядром, и это не предпочтение, а физика.
    #
    # Два агента на одном слоте llama-server вытесняют префиксы друг друга: у каждого свой
    # системный промпт по десяткам тысяч токенов, и на каждом ходу слот перепрефиливает чужой.
    # Развести их по разным провайдерам дешевле, чем делить 262k контекста пополам через
    # --parallel 2.
    #
    # Локальная модель по решению владельца. ВНИМАНИЕ: она же обслуживает ядро, а слот у
    # llama-server один — два агента с разными префиксами вытесняют друг друга и платят полный
    # prefill каждый ход. Для осмысленного прогона держать одного агента
    # (`cvar ai.auto_claim false` до startround) либо поднять llama-server с --parallel 2.
    llmChain: local
    channels:
    - Binary
    - Common
    - Engineering
    - Science
  # Манипулятор ставится сверх штатных модулей типа: без свободной руки робот не может носить
  # предметы вовсе, а значит и работать с ними. См. AiBorgModuleGripper ниже.
  - type: BorgChassis
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - BorgModuleEngineering
  - type: ContainerFill
    containers:
      borg_module:
      - AiBorgModuleGripper
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh

# Манипулятор: модуль с ОДНОЙ ПУСТОЙ рукой.
#
# Это не починка, а сознательно выданная возможность, и она отступает от ванильного борга.
# У штатных модулей каждая рука занята несъёмным инструментом (лом, ключ, отвёртка…), поэтому
# ванильный борг не может НИЧЕГО носить — ни канистру, ни упаковку, ни ящик. Проверено сценарием:
# на попытке взять упаковку экранирования робот честно отвечал «нет свободной руки».
#
# Для нашего робота это делало недостижимой любую работу с предметами, то есть примерно всю
# инженерную работу: собрать реактор нельзя, не перенеся к нему детали. Пустая рука это чинит и
# ничего больше не даёт — ни доступа, ни силы, ни скорости.
- type: entity
  id: AiBorgModuleGripper
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: manipulator cyborg module
  description: Пустой манипулятор. Позволяет носить предметы, как это делает человек рукой.
  components:
  - type: ItemBorgModule
    hands:
    - hand: {}
