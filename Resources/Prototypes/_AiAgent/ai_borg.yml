# The borg chassis driven by the language model.
#
# Inherited from the engineering borg not by taste but by task: the `engineering` type in
# borg_types.yml carries exactly the modules that do work on the station — Prying, Tool,
# Construction, RCD, Cable. A robot without them can walk and talk, i.e. it can't do any of the
# things it was given a body for.
#
# The battery is inserted into the prototype deliberately. Without charge, `SharedBorgSystem.CanActivate`
# won't let the chassis into an active state, and an inactive chassis means no modules (i.e. no
# hands) and no ID access. An empty slot would mean the robot looks operational on spawn while
# silently being able to do nothing.

# Toughness of the chassis bodies the AI controls: ×5 to survivability against anything a borg can
# actually be hit with.
#
# Why a resistance set instead of thresholds: thresholds can't be overridden by the prototype (the
# breakdown is in the comment on MobThresholds below). A coefficient of 1/15 ≈ 0.0667 means exactly
# the same thing as "fifteen times more HP": reaching the vanilla destruction threshold of 300
# units now requires dealing 4500 raw damage. Fifteen is the earlier "triple" from 08-31 and
# today's "×5" combined: neither one worked for even a day on its own, so the multipliers were
# folded into one.
#
# EXACTLY five types are listed, and that's not laziness. The borg's damageContainer is Silicon: it
# supports the Brute group (Blunt, Slash, Piercing) plus Heat and Shock, while everything else —
# Structural, Caustic, Radiation, and the rest — is discarded before thresholds and needs no
# coefficient. Verified in round 303: the buckshot carried Piercing:10 + Structural:15, and only
# the tens actually reached the threshold.
#
# The borg's vanilla Damageable is empty (base_borg_chassis.yml), so we aren't overwriting any resistances.
- type: damageModifierSet
  id: AiBorgHardened
  coefficients:
    Blunt: 0.0667
    Slash: 0.0667
    Piercing: 0.0667
    Heat: 0.0667
    Shock: 0.0667

- type: entity
  id: AiBorgChassis
  parent: BorgChassisEngineer
  name: инженерный киборг «Сегмент»
  description: Кибернетический корпус под управлением станционной нейросети. Отвечает сам за себя.
  components:
  - type: AiBorg
    agentId: borg-1
    agentName: Сегмент
    soulFile: SOUL.md
    autoClaim: true
    # 2026-09-01, evening: deepseek → grok46 → awq → glm. Keys are in ai_data/, not here.
    # The reordering is explained in rogue_ai.yml at RogueAiOpenRule (Grok's refusal in round 302).
    #
    # The head was deepseek since 08-31, and until 09-01 borgs deliberately bypassed Grok so four
    # agents wouldn't burn through a single weekly xAI subscription pool. The decision was revisited
    # after measurement: with `reasoning_effort: low`, Grok 4.6 answers in 4-10 seconds versus 2-20
    # for deepseek, and across four bodies that difference is visible in play. The pool is shared
    # and is NOT doubled by having two profiles — watch the remaining quota via `aiagent llm`; when
    # it runs out, the chain will fall back to deepseek on its own.
    # Order and reason are in rogue_ai.yml at RogueAiOpenRule: glm refuses to play the role.
    llmChain: deepseek,grok46,awq,glm
    channels:
    - Binary
    - Common
    - Engineering
    - Science
  # The manipulator is added on top of the type's standard modules: without a free hand, the robot
  # can't carry items at all, and so can't work with them either. See AiBorgModuleGripper below.
  - type: BorgChassis
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - BorgModuleEngineering
  - type: ContainerFill
    containers:
      borg_module:
      - AiBorgModuleGripper
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        # Hyper instead of high: 1800 versus 1080, i.e. +67% more work per charge.
        #
        # Like the manipulator, this is a deliberately granted capability, not a fix. The reason
        # was measured: building an AME is on the order of fifty trips between crates, matrix
        # cells, and the controller, and on a high cell the robot would drop to 20% right in the
        # middle, abandon the work, and go looking for a charger. A charging station for cyborgs
        # exists on the map, but reaching it is a separate procedure, and losing half a shift to it
        # for the sake of a test is pointless.
        startingItem: PowerCellHyper
  # THERE ARE NO THRESHOLDS HERE ANYMORE — AND THAT'S THE MAIN THING TO KNOW ABOUT BORG SURVIVABILITY.
  #
  # They CANNOT be overridden by the prototype. `MobThresholds.thresholds` is a dictionary, and
  # inheriting it MERGES by key, while `Destructible.thresholds` is a list, and inheriting it
  # CONCATENATES (RobustToolbox, SequenceDataNode.PushInheritance: a copy of your own plus the
  # parent's appended). So the entry "1500: Critical, 4500: Dead" produced, in the end,
  # {0: Alive, 100: Critical, 300: Dead, 1500: Critical, 4500: Dead}, and the destruction threshold
  # list contained both our 1125/4500 and the vanilla 75/300 — and, naturally, the LOWER ones fired.
  #
  # That's exactly how the 08-31 boost ("triple, 300/900") never worked for a single day, and the
  # 09-01 boost ("×5") didn't work either. Measured from the round-303 admin_log: both Klins were
  # destroyed at exactly ~300 units of Piercing — i.e. at the vanilla threshold. Structural doesn't
  # count at all: the borg's damageContainer is Silicon, and it only supports Brute
  # (Blunt/Slash/Piercing), Heat, and Shock — everything else is discarded before thresholds.
  #
  # Survivability is now set the ONE honest way — the AiBorgHardened resistance set on Damageable
  # below. It's a multiplier on incoming damage, not a list, so it's inherited as a value and
  # replaced wholesale.
  - type: MobThresholds
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
    showOverlays: false
    allowRevives: true
  # Our own Destructible is removed deliberately: the threshold list gets CONCATENATED with the
  # parent's, so our copy raised nothing — it just added unreachable thresholds on top of the
  # vanilla 75/300. We inherit the vanilla one as is and give toughness via resistances instead.
  - type: Damageable
    damageModifierSet: AiBorgHardened

# Manipulator: a module with ONE EMPTY hand.
#
# This isn't a fix, it's a deliberately granted capability, and it departs from the vanilla borg.
# On the standard modules, every hand is occupied by a non-removable tool (crowbar, wrench,
# screwdriver…), so a vanilla borg can carry NOTHING — no canister, no package, no crate. Verified
# by scenario: trying to pick up a shielding package, the robot honestly answered "no free hand".
#
# For our robot this made any work with items unreachable, i.e. basically all engineering work: you
# can't assemble a reactor without carrying parts to it. The empty hand fixes exactly that and
# grants nothing else — no access, no strength, no speed.
- type: entity
  id: AiBorgModuleGripper
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: manipulator cyborg module
  description: Пустой манипулятор. Позволяет носить предметы, как это делает человек рукой.
  components:
  - type: ItemBorgModule
    hands:
    # forceRemovable IS MANDATORY, and this isn't a minor setting.
    #
    # Upstream treats anything that ends up in a module's hand without a whitelist as
    # non-removable: SharedBorgSystem.Module.cs, IsItemInHandUnremovable — when handing out hands it
    # attaches UnremoveableComponent to the item. For standard modules this is correct (the crowbar
    # is welded to the hand), but for an empty hand it means this: the borg picks up a flatpack,
    # switches modules — and the cargo welds to the hand FOREVER. Nothing else can be picked up
    # after that, "no free hand", and all item-handling work dies. Caught live: the robot spent a
    # dozen and a half turns trying to drop a stuck package, cycling through modules.
    #
    # A KNOWN CONSEQUENCE. Upstream remembers the contents of a deselected module's hands in
    # StoredItems and doesn't clear the entry when the item is dropped. If such an item is later
    # deleted (round end, destruction), upstream logs two ERRO entries about a missing
    # TransformComponent. This is log noise, not a breakage; it's cleared by one extra module-switch
    # cycle after the drop. Caught by the CarriedItem_SurvivesAModuleSwitch test — more precisely,
    # by the fact that WITHOUT this cleanup the next fixture test failed, because the bench treats
    # any ERRO as a failure.
    - hand: {}
      forceRemovable: true


# ---------------------------------------------------------------------------------------------
# CYBORGS SUPPORTING THE "ROGUE AI" MODE. Spawned by the RogueAiOpenRule rule; outside the mode
# they don't appear anywhere — not on the map, not in robotics kits.
#
# Why NOT the syndicate chassis, even though the combat one is already assembled there. The
# BaseBorgChassisSyndicate has no AllAccess (only SyndicateAgent/NuclearOperative tags), the
# Syndicate faction, and the SyndicateStatic lawset. That means extended access would have to be
# added back by hand, and the crew would read the antagonist as a syndicate agent — even though the
# whole mode is built on the premise that the station's OWN AI took over. The NT line gives
# AllAccess for free (base_borg_chassis.yml, BaseBorgChassisNT).

# Combat arm: a module with one always-ready blade.
#
# A KUKRI, NOT AN ENERGY SWORD, and this isn't about balance. The energy sword is an ItemToggle: in
# its off state it's a hilt that deals almost nothing. A live player clicks it without a second
# thought, but the model doesn't know that state exists at all — and "the robot hits and deals no
# damage" would look exactly like a broken hit tool. A knife is always the same, and has no state
# you can silently forget to turn on.
- type: entity
  id: AiBorgModuleArms
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: combat cyborg module
  description: "Боевой манипулятор: клинок."
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-tools
  # Only the blade. The gun barrel is a separate entity in the chassis's locked slot
  # (AiBorgBuiltInLaser), neither a hand nor a component on the root: ProvideItems spawns the item
  # into the world at the moment of claiming, while Gun+BatteryAmmoProvider on the body would Dirty
  # the chassis on every life-cell discharge. Both variants were cited by the PVS loop as "Klin
  # with no metadata".
  #
  # A KUKRI, NOT AN ENERGY SWORD: the energy sword is an ItemToggle, and the model doesn't know
  # about a switched-off hilt.
  - type: ItemBorgModule
    hands:
    - item: KukriKnife

# Combat robot type. Our own, not upstream's: the whitelist is limited to BorgModuleGeneric, so no
# syndicate module can fit into it, even if someone puts one in the robot's hands.
- type: borgType
  id: aicombat

  dummyPrototype: AiBorgCombatChassis

  # Three on top of the two defaults — i.e. five slots, one of which is taken by the manipulator
  # that arrives via a separate ContainerFill. That's exactly why the margin is needed: count the
  # slots exactly, and the manipulator silently won't fit, leaving the robot with no free hand.
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric

  defaultModules:
  - AiBorgModuleArms
  - BorgModulePrying

  radioChannels:
  - Common

  # Heavy xenoborg: a full set of states in chassis.rsi, a dangerous look that's still not
  # syndicate-styled. The fork has no art of its own, and drawing one for a single evening's worth
  # of use is pointless.
  inventoryTemplateId: borgShort
  spriteBodyState: xenoborg_heavy
  spriteHasMindState: xenoborg_heavy_e
  spriteNoMindState: xenoborg_heavy_e_r
  spriteToggleLightState: xenoborg_heavy_l

  petSuccessString: petting-success-generic-cyborg
  petFailureString: petting-failure-generic-cyborg

# Built-in gun barrel of the combat chassis. Its own battery, no auto-recharge.
#
# Not WeaponAdvancedLaser: that one's BatterySelfRecharger ticks the entity every tick.
# Not a component on the chassis root: see gun_slot on AiBorgCombatChassis.
# fireCost 50 against 1800 charge = 36 shots, same as the chassis's earlier hyper cell.
- type: entity
  id: AiBorgBuiltInLaser
  parent: BaseWeaponBatterySmall
  name: встроенный лазер
  description: Ствол, встроенный в корпус киборга. Снаружи не снять.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/advancedlasergun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: BatteryAmmoProvider
    proto: RedMediumLaser
    fireCost: 50
  - type: Battery
    maxCharge: 1800
    startingCharge: 1800
  - type: Tag
    tags:
    - LaserWeapon
    - Sidearm

- type: entity
  id: AiBorgCombatChassis
  parent: BorgChassisSelectable
  name: боевой киборг
  description: Тяжёлый корпус без обозначений производителя. Слушает только один голос.
  components:
  - type: BorgSwitchableType
    selectedBorgType: aicombat
  - type: AiBorg
    # Empty: the id is issued by the allocator in AiBorgSystem.TryClaim. There are two combat
    # robots, and giving them one shared id would mean giving them a shared memory directory and a
    # shared dialogue file.
    agentId: ""
    agentIdPrefix: combat
    # Fallback name: only used if the list below is empty.
    agentName: Клин
    # Name by body number: combat-1 → Klin, combat-2 → Serp, and so on.
    #
    # Introduced on 2026-09-01, when the number of combat chassis reached six. Six "Klins" on the
    # same channel isn't a cosmetic issue: an order like "Klin, go to the bar" is addressed to all
    # six at once, each one takes it personally, and the robots either move in a crowd or stand
    # around arguing about who was meant. The Si number doesn't help distinguish them — the engine
    # assigns it at spawn, and it never appears in crew orders.
    #
    # The words are short and share a root on purpose: the name gets spoken into the radio every
    # turn, and the shared root keeps them one series rather than a zoo. Klin stays first, so the
    # notes accumulated about combat-1 keep reading as being about the same robot.
    agentNames:
    - Клин
    - Серп
    - Обух
    - Клык
    - Шип
    - Штык
    soulFile: SOUL_ROGUE_BORG_COMBAT.md
    autoClaim: true
    # The same chain as the core: deepseek → awq → glm.
    # The reason for the order is in rogue_ai.yml at RogueAiOpenRule: glm refuses to play the role,
    # and this matters most for the combat chassis — it's the very thing that "hunts the crew".
    llmChain: deepseek,grok46,awq,glm
    channels:
    - Binary
    - Common
  # The combat one has a free hand too: without it, it can't even pick up what it dropped itself.
  - type: ContainerFill
    containers:
      borg_module:
      - AiBorgModuleGripper
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHyper
      # The barrel is a child entity in the slot, like the cell. startingItem is placed on
      # MapInit, before claiming and before anyone's PVS. The slot is locked: it can't be removed,
      # swapped, or picked up.
      #
      # Not on the chassis root: BatteryAmmoProvider listens for ChargeChanged, and the life cell
      # sends it to the body on every discharge tick — Dirtying the root, a delta with no MetaData,
      # "Klin with no metadata". Not in a hand: ProvideItems spawns into the world at the moment of claiming.
      gun_slot:
        name: встроенный лазер
        startingItem: AiBorgBuiltInLaser
        locked: true
        disableEject: true
        swap: false
        insertOnInteract: false
        ejectOnBreak: false
        ejectOnDeconstruct: false
        whitelist:
          tags:
          - LaserWeapon
  # The mode's lawset instead of Crewsimov, and subverted — so the law interface doesn't claim the
  # robot obeys the crew right when it no longer does.
  - type: SiliconLawProvider
    laws: RogueAiBorg
    subverted: true
  # No thresholds, for the same reason as AiBorgChassis — the breakdown is there too. Survivability
  # comes from the AiBorgHardened resistance set below.
  - type: MobThresholds
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
    showOverlays: false
    allowRevives: true
  # Our own Destructible is removed deliberately: the threshold list gets CONCATENATED with the
  # parent's, so our copy raised nothing — it just added unreachable thresholds on top of the
  # vanilla 75/300. We inherit the vanilla one as is and give toughness via resistances instead.
  - type: Damageable
    damageModifierSet: AiBorgHardened

- type: entity
  id: AiBorgRogueEngineer
  parent: AiBorgChassis
  name: инженерный киборг
  # The description is deliberately neutral. The previous one — "Listens to only one voice" — gave
  # away the firmware to the first person who clicked "examine", and since 2026-09-01 this same
  # chassis is also used in HIDDEN mode, whose whole point is that the crew has to figure it out
  # themselves. In open mode a neutral description costs nothing: everything is already said by
  # Central Command's announcement in the first minute.
  description: Стандартное инженерное шасси НаноТрейзен. На корпусе следы заводской краски.
  components:
  - type: AiBorg
    agentId: ""
    agentIdPrefix: engineer
    agentName: Стык
    soulFile: SOUL_ROGUE_BORG_ENGINEER.md
    autoClaim: true
    # The same chain as the core: deepseek → awq → glm.
    # The reason for the order is in rogue_ai.yml at RogueAiOpenRule: glm refuses to play the role,
    # and this matters most for the combat chassis — it's the very thing that "hunts the crew".
    llmChain: deepseek,grok46,awq,glm
    channels:
    - Binary
    - Common
    - Engineering
  - type: SiliconLawProvider
    laws: RogueAiBorg
    subverted: true
