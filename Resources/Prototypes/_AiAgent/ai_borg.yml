# Шасси борга, которое ведёт языковая модель.
#
# Наследуется от инженерного борга не по вкусу, а по задаче: у типа `engineering` в
# borg_types.yml стоят ровно те модули, которыми делают работу на станции — Prying, Tool,
# Construction, RCD, Cable. Робот без них умеет ходить и разговаривать, то есть не умеет
# ничего из того, ради чего ему дали тело.
#
# Батарея вставлена прототипом намеренно. Без заряда `SharedBorgSystem.CanActivate` не пускает
# шасси в активное состояние, а неактивное шасси — это отсутствие модулей (то есть рук) и
# отсутствие доступа по ID. Пустой слот означал бы, что робот при спавне выглядит рабочим и
# молча не может ничего.

# Прочность корпусов, которыми управляет ИИ: ×5 к живучести против всего, что борг вообще
# способен получить.
#
# Почему набор сопротивлений, а не пороги: пороги прототипом не переопределяются (разбор — в
# комментарии у MobThresholds ниже). Коэффициент 1/15 ≈ 0.0667 означает ровно то же, что
# «в пятнадцать раз больше HP»: до ванильного порога разрушения в 300 единиц теперь надо нанести
# 4500 сырого урона. Пятнадцать — это прежние «втрое» от 31.08 и сегодняшние «×5» вместе: ни то,
# ни другое не работало ни дня, так что множители сложились в один.
#
# Перечислены ИМЕННО пять типов, и это не лень. damageContainer у борга — Silicon: он поддерживает
# группу Brute (Blunt, Slash, Piercing) плюс Heat и Shock, а всё прочее — Structural, Caustic,
# Radiation и остальные — отбрасывается ещё до порогов и коэффициента не требует. Проверено в
# раунде 303: дробь несла Piercing:10 + Structural:15, а до порога доходили только десятки.
#
# Ванильный Damageable у борга пуст (base_borg_chassis.yml), никаких сопротивлений мы не затираем.
- type: damageModifierSet
  id: AiBorgHardened
  coefficients:
    Blunt: 0.0667
    Slash: 0.0667
    Piercing: 0.0667
    Heat: 0.0667
    Shock: 0.0667

- type: entity
  id: AiBorgChassis
  parent: BorgChassisEngineer
  name: инженерный киборг «Сегмент»
  description: Кибернетический корпус под управлением станционной нейросети. Отвечает сам за себя.
  components:
  - type: AiBorg
    agentId: borg-1
    agentName: Сегмент
    soulFile: SOUL.md
    autoClaim: true
    # 01.09.2026, вечер: deepseek → grok46 → awq → glm. Ключи в ai_data/, не здесь.
    # Разбор перестановки — в rogue_ai.yml у RogueAiOpenRule (отказ Grok в раунде 302).
    #
    # Голова была deepseek с 31.08, и до 01.09 борги нарочно шли мимо Grok, чтобы четыре агента не
    # выжигали один недельный пул подписки xAI. Решение пересмотрено по замеру: с
    # `reasoning_effort: low` Grok 4.6 отвечает за 4-10 секунд против 2-20 у deepseek, и на
    # четырёх телах эта разница видна в игре. Пул общий и НЕ удваивается двумя профилями —
    # следить за остатком по `aiagent llm`; когда кончится, цепочка сама уедет на deepseek.
    # Порядок и причина — в rogue_ai.yml у RogueAiOpenRule: glm отказывается отыгрывать роль.
    llmChain: deepseek,grok46,awq,glm
    channels:
    - Binary
    - Common
    - Engineering
    - Science
  # Манипулятор ставится сверх штатных модулей типа: без свободной руки робот не может носить
  # предметы вовсе, а значит и работать с ними. См. AiBorgModuleGripper ниже.
  - type: BorgChassis
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - BorgModuleEngineering
  - type: ContainerFill
    containers:
      borg_module:
      - AiBorgModuleGripper
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        # Гипер вместо высокой: 1800 против 1080, то есть +67% работы на одном заряде.
        #
        # Как и манипулятор, это сознательно выданная возможность, а не починка. Причина
        # измеренная: сборка АМЭ — это полсотни переходов между ящиками, клетками квадрата и
        # контроллером, и на высокой ячейке робот садился до 20% ровно на середине, бросал работу
        # и уходил искать зарядку. Станция для киборгов на карте есть, но вход в неё — отдельная
        # процедура, и терять на неё половину смены ради теста бессмысленно.
        startingItem: PowerCellHyper
  # ПОРОГОВ ЗДЕСЬ БОЛЬШЕ НЕТ — И ЭТО ГЛАВНОЕ, ЧТО НАДО ЗНАТЬ ПРО ЖИВУЧЕСТЬ БОРГА.
  #
  # Переопределить их прототипом НЕЛЬЗЯ. `MobThresholds.thresholds` — словарь, и наследование
  # его СЛИВАЕТ по ключам, а `Destructible.thresholds` — список, и наследование его
  # СКЛЕИВАЕТ (RobustToolbox, SequenceDataNode.PushInheritance: копия своего плюс дописанный
  # родительский). Поэтому запись «1500: Critical, 4500: Dead» давала на выходе
  # {0: Alive, 100: Critical, 300: Dead, 1500: Critical, 4500: Dead}, а список порогов разрушения
  # содержал и наши 1125/4500, и ванильные 75/300 — срабатывали, разумеется, НИЗКИЕ.
  #
  # Так и вышло, что буст 31.08 («втрое, 300/900») не работал ни дня, и буст 01.09 («×5»)
  # не сработал тоже. Замерено по admin_log раунда 303: оба Клина разрушены ровно на ~300
  # единицах Piercing — то есть на ванильном пороге. Structural в счёт не идёт вообще:
  # damageContainer у борга Silicon, а он поддерживает только Brute (Blunt/Slash/Piercing),
  # Heat и Shock, всё остальное отбрасывается до порогов.
  #
  # Живучесть теперь задаётся ЕДИНСТВЕННЫМ честным способом — набором сопротивлений
  # AiBorgHardened на Damageable ниже. Он множитель на входящий урон, а не список, поэтому
  # наследуется как значение и подменяется целиком.
  - type: MobThresholds
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
    showOverlays: false
    allowRevives: true
  # Свой Destructible убран намеренно: список порогов СКЛЕИВАЕТСЯ с родительским, поэтому наша
  # копия ничего не поднимала — просто добавляла недостижимые пороги к ванильным 75/300.
  # Наследуем ванильный как есть, а прочность даём сопротивлениями.
  - type: Damageable
    damageModifierSet: AiBorgHardened

# Манипулятор: модуль с ОДНОЙ ПУСТОЙ рукой.
#
# Это не починка, а сознательно выданная возможность, и она отступает от ванильного борга.
# У штатных модулей каждая рука занята несъёмным инструментом (лом, ключ, отвёртка…), поэтому
# ванильный борг не может НИЧЕГО носить — ни канистру, ни упаковку, ни ящик. Проверено сценарием:
# на попытке взять упаковку экранирования робот честно отвечал «нет свободной руки».
#
# Для нашего робота это делало недостижимой любую работу с предметами, то есть примерно всю
# инженерную работу: собрать реактор нельзя, не перенеся к нему детали. Пустая рука это чинит и
# ничего больше не даёт — ни доступа, ни силы, ни скорости.
- type: entity
  id: AiBorgModuleGripper
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: manipulator cyborg module
  description: Пустой манипулятор. Позволяет носить предметы, как это делает человек рукой.
  components:
  - type: ItemBorgModule
    hands:
    # forceRemovable ОБЯЗАТЕЛЕН, и это не мелочь настройки.
    #
    # Апстрим считает несъёмным всё, что оказалось в руке модуля без белого списка:
    # SharedBorgSystem.Module.cs, IsItemInHandUnremovable — при выдаче рук он вешает
    # UnremoveableComponent на предмет. Для штатных модулей это правильно (лом приварен к руке),
    # но для пустой руки означает вот что: борг берёт флэтпак, переключает модуль — и груз
    # приваривается к руке НАВСЕГДА. Дальше не берётся уже ничего, «нет свободной руки», и вся
    # работа с предметами умирает. Поймано живьём: робот полтора десятка ходов пытался выложить
    # застрявшую упаковку, перебирая модули.
    #
    # ИЗВЕСТНОЕ СЛЕДСТВИЕ. Апстрим помнит содержимое рук деселектнутого модуля в StoredItems и не
    # чистит запись, когда предмет выложили. Если такой предмет потом удалить (конец раунда,
    # уничтожение), апстрим напишет в лог два ERRO про пропавший TransformComponent. Это шум в
    # логе, а не поломка; снимается лишним циклом смены модуля после drop. Ловится тестом
    # CarriedItem_SurvivesAModuleSwitch — точнее, тем, что БЕЗ этой уборки падал следующий тест
    # фикстуры, потому что стенд считает провалом любой ERRO.
    - hand: {}
      forceRemovable: true


# ---------------------------------------------------------------------------------------------
# КИБОРГИ ПОДДЕРЖКИ РЕЖИМА «ЗЛОЙ ИИ». Спавнятся правилом RogueAiOpenRule, вне режима не
# встречаются нигде — ни на карте, ни в наборах роботехника.
#
# Почему НЕ синдикатское шасси, хотя боевое там уже собрано. У BaseBorgChassisSyndicate нет
# AllAccess (только теги SyndicateAgent/NuclearOperative), фракция Syndicate и лоусет
# SyndicateStatic. То есть расширенный доступ пришлось бы возвращать руками, а экипаж читал бы
# антагониста как синдикат — при том что весь режим построен на том, что станцию захватил СВОЙ
# ИИ. Линия NT даёт AllAccess даром (base_borg_chassis.yml, BaseBorgChassisNT).

# Боевая рука: модуль с одним всегда готовым клинком.
#
# КУКРИ, А НЕ ЭНЕРГОМЕЧ, и это не про баланс. Энергомеч — ItemToggle: в выключенном виде это
# рукоять, которая не наносит почти ничего. Живой игрок щёлкает по нему не задумываясь, а модель
# про такое состояние не знает вовсе — и «робот бьёт и не наносит урона» выглядело бы точно так
# же, как сломанный инструмент hit. Нож всегда одинаков, и у него нет состояния, которое можно
# молча забыть включить.
- type: entity
  id: AiBorgModuleArms
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: combat cyborg module
  description: "Боевой манипулятор: клинок."
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-tools
  # Только клинок. Ствол — отдельная сущность в запертом слоте шасси (AiBorgBuiltInLaser),
  # не рука и не компонент на корне: ProvideItems спавнит предмет в мир в момент захвата,
  # а Gun+BatteryAmmoProvider на корпусе Dirty'ит шасси на каждый разряд ячейки жизни.
  # Оба варианта цитировались петлёй PVS как «Клин без метаданных».
  #
  # КУКРИ, А НЕ ЭНЕРГОМЕЧ: энергомеч — ItemToggle, модель про выключенную рукоять не знает.
  - type: ItemBorgModule
    hands:
    - item: KukriKnife

# Тип боевого робота. Свой, а не апстримовый: whitelist ограничен BorgModuleGeneric, то есть
# в него не влезет ни один синдикатский модуль, даже если кто-то положит его роботу в руки.
- type: borgType
  id: aicombat

  dummyPrototype: AiBorgCombatChassis

  # Три сверх двух дефолтных — то есть пять слотов, из которых один занимает манипулятор,
  # приезжающий отдельным ContainerFill. Запас нужен именно поэтому: посчитай слоты впритык,
  # и манипулятор молча не влезет, а робот останется без свободной руки.
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric

  defaultModules:
  - AiBorgModuleArms
  - BorgModulePrying

  radioChannels:
  - Common

  # Тяжёлый ксеноборг: полный набор состояний в chassis.rsi, вид опасный и при этом не
  # синдикатский. Своей графики у форка нет, а рисовать её ради одного вечера незачем.
  inventoryTemplateId: borgShort
  spriteBodyState: xenoborg_heavy
  spriteHasMindState: xenoborg_heavy_e
  spriteNoMindState: xenoborg_heavy_e_r
  spriteToggleLightState: xenoborg_heavy_l

  petSuccessString: petting-success-generic-cyborg
  petFailureString: petting-failure-generic-cyborg

# Встроенный ствол боевого шасси. Своя батарея, без автозаряда.
#
# Не WeaponAdvancedLaser: у того BatterySelfRecharger тикает сущность каждый такт.
# Не компонент на корне шасси: см. gun_slot у AiBorgCombatChassis.
# fireCost 50 при 1800 заряда — 36 выстрелов, как у прежней гипер-ячейки шасси.
- type: entity
  id: AiBorgBuiltInLaser
  parent: BaseWeaponBatterySmall
  name: встроенный лазер
  description: Ствол, встроенный в корпус киборга. Снаружи не снять.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/advancedlasergun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: BatteryAmmoProvider
    proto: RedMediumLaser
    fireCost: 50
  - type: Battery
    maxCharge: 1800
    startingCharge: 1800
  - type: Tag
    tags:
    - LaserWeapon
    - Sidearm

- type: entity
  id: AiBorgCombatChassis
  parent: BorgChassisSelectable
  name: боевой киборг
  description: Тяжёлый корпус без обозначений производителя. Слушает только один голос.
  components:
  - type: BorgSwitchableType
    selectedBorgType: aicombat
  - type: AiBorg
    # Пусто: id выдаёт аллокатор в AiBorgSystem.TryClaim. Боевых роботов двое, и прописать им
    # один id значило бы дать им общий каталог памяти и общий файл диалога.
    agentId: ""
    agentIdPrefix: combat
    # Запасное имя: работает, только если список ниже пуст.
    agentName: Клин
    # Имя по номеру тела: combat-1 → Клин, combat-2 → Серп и так далее.
    #
    # Заведено 01.09.2026, когда боевых корпусов стало шесть. Шесть «Клинов» в одном эфире — это
    # не косметика: приказ «Клин, иди в бар» адресован сразу шестерым, каждый принимает его на
    # свой счёт, и роботы идут толпой либо стоят, выясняя, кого имели в виду. Номер Si различать
    # не помогает — его выдаёт движок при спавне, и в приказах экипажа он не звучит.
    #
    # Слова короткие и однокоренные нарочно: имя произносится в рацию каждый ход, а общий корень
    # держит их одной серией, а не зоопарком. Клин остаётся первым, чтобы накопленные заметки о
    # combat-1 продолжали читаться про того же робота.
    agentNames:
    - Клин
    - Серп
    - Обух
    - Клык
    - Шип
    - Штык
    soulFile: SOUL_ROGUE_BORG_COMBAT.md
    autoClaim: true
    # Та же цепочка, что у ядра: deepseek → awq → glm.
    # Причина порядка — в rogue_ai.yml у RogueAiOpenRule: glm отказывается отыгрывать роль,
    # и боевому шасси это касается сильнее всего — оно и есть та самая «охота на экипаж».
    llmChain: deepseek,grok46,awq,glm
    channels:
    - Binary
    - Common
  # Свободная рука есть и у боевого: без неё он не поднимет даже то, что сам уронил.
  - type: ContainerFill
    containers:
      borg_module:
      - AiBorgModuleGripper
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHyper
      # Ствол — дочерняя сущность в слоте, как ячейка. startingItem кладётся на MapInit,
      # до захвата и до чужого PVS. Слот заперт: его нельзя вынуть, сменить, подобрать.
      #
      # Не на корне шасси: BatteryAmmoProvider слушает ChargeChanged, а ячейка жизни
      # шлёт его на корпус каждый тик разряда — Dirty корня, дельта без MetaData,
      # «Клин без метаданных». Не в руке: ProvideItems спавнит в мир в момент claim.
      gun_slot:
        name: встроенный лазер
        startingItem: AiBorgBuiltInLaser
        locked: true
        disableEject: true
        swap: false
        insertOnInteract: false
        ejectOnBreak: false
        ejectOnDeconstruct: false
        whitelist:
          tags:
          - LaserWeapon
  # Лоусет режима вместо Crewsimov, и subverted — чтобы интерфейс законов не утверждал, будто
  # робот подчиняется экипажу, ровно когда он уже не подчиняется.
  - type: SiliconLawProvider
    laws: RogueAiBorg
    subverted: true
  # Порогов нет по той же причине, что у AiBorgChassis — разбор там же. Живучесть даёт
  # набор сопротивлений AiBorgHardened ниже.
  - type: MobThresholds
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
    showOverlays: false
    allowRevives: true
  # Свой Destructible убран намеренно: список порогов СКЛЕИВАЕТСЯ с родительским, поэтому наша
  # копия ничего не поднимала — просто добавляла недостижимые пороги к ванильным 75/300.
  # Наследуем ванильный как есть, а прочность даём сопротивлениями.
  - type: Damageable
    damageModifierSet: AiBorgHardened

- type: entity
  id: AiBorgRogueEngineer
  parent: AiBorgChassis
  name: инженерный киборг
  # Описание нарочно нейтральное. Прежнее — «Слушает только один голос» — выдавало прошивку
  # первому, кто нажмёт «осмотреть», а с 01.09.2026 этот же корпус ставится и в СКРЫТОМ режиме,
  # весь смысл которого в том, что экипаж должен догадаться сам. В открытом режиме нейтральное
  # описание ничего не стоит: там всё сказано объявлением ЦК на первой минуте.
  description: Стандартное инженерное шасси НаноТрейзен. На корпусе следы заводской краски.
  components:
  - type: AiBorg
    agentId: ""
    agentIdPrefix: engineer
    agentName: Стык
    soulFile: SOUL_ROGUE_BORG_ENGINEER.md
    autoClaim: true
    # Та же цепочка, что у ядра: deepseek → awq → glm.
    # Причина порядка — в rogue_ai.yml у RogueAiOpenRule: glm отказывается отыгрывать роль,
    # и боевому шасси это касается сильнее всего — оно и есть та самая «охота на экипаж».
    llmChain: deepseek,grok46,awq,glm
    channels:
    - Binary
    - Common
    - Engineering
  - type: SiliconLawProvider
    laws: RogueAiBorg
    subverted: true
