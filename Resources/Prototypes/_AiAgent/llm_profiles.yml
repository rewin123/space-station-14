# Провайдеры модели. Порядок задаётся НЕ здесь, а в `ai.llm_chain`.
#
# Читает RoutingLlmClient; описание полей — в Llm/AiLlmProfilePrototype.cs. Здесь только набор
# доступных провайдеров; кто из них главный и в каком порядке идут фаллбеки — операционное решение,
# и меняется оно командой `cvar ai.llm_chain "codex,grok,deepseek,local"` на живом сервере.
#
# Пустой `ai.llm_chain` — рабочий режим, а не «не настроено»: тогда агент работает по одиночному
# `ai.endpoint`, как до появления профилей. Это и есть откат, если цепочка сломает раунд.
#
# ---------------------------------------------------------------------------------------------
# СЕКРЕТОВ ЗДЕСЬ БЫТЬ НЕ МОЖЕТ. Content.Server/Acz/ContentMagicAczProvider.cs раздаёт всю папку
# Resources/ каждому подключившемуся игроку — ключ, положенный в этот файл, уехал бы к первому же
# зашедшему. Поэтому `keyFile` — это ИМЯ файла внутри ai.data_dir, а не значение.
#
# ---------------------------------------------------------------------------------------------
# ПРО `ctxLimit`: РИСК НЕСИММЕТРИЧЕН, И ЧИСЛА ЗДЕСЬ СОЗНАТЕЛЬНО ЗАНИЖЕНЫ.
#
# Завысить — значит позволить диалогу вырасти за настоящее окно провайдера, и тогда ход кончается
# HTTP-ошибкой, а в журнале до самого отказа виден здоровый размер промпта. Занизить — значит лишь
# компактиться чаще, чем нужно, то есть терять историю, но не раунд. Поэтому у облачных профилей
# стоит 128000 независимо от того, что обещает вендор, и поднимать это следует по факту: сверить с
# `GET /v1/models` у моста и с документацией провайдера, а не по статье в интернете.
#
# У локального профиля числа нет вовсе — там `ctxProbe: Props`, и llama-server сообщает настоящий
# n_ctx сам. Это единственный провайдер, который умеет отвечать на такой вопрос.
# ---------------------------------------------------------------------------------------------

# Локальная модель. Последний рубеж цепочки: работает, когда нет ни интернета, ни моста.
#
# `dialect: LlamaCpp` — единственный, кому легально уходят top_k, min_p, cache_prompt и id_slot.
# Уровень размышления здесь НЕ настраивается из игры: он задан флагом запуска llama-server
# `--chat-template-kwargs '{"reasoning_effort":"low"}'`, а поле в теле запроса llama.cpp принимает
# и молча игнорирует. Поэтому `reasoningEffort` тут пуст — настройка, которая выглядит рабочей и не
# делает ничего, хуже отсутствующей.
- type: aiLlmProfile
  id: local
  endpoint: http://127.0.0.1:9292/v1
  model: qwen3.8-27b-q8
  dialect: LlamaCpp
  quota: Free
  proxy: None
  ctxProbe: Props
  # 600, а не 180 (19.08.2026): на контексте под 100k один ход борга занимал 177 с чистой
  # генерации (7849 токенов размышления), и прежний потолок рубил ровно те ходы, которые
  # дороже всего обошлись — ход терялся, провайдер уходил в кулдаун, робот стоял и разряжался.
  # Профиль перебивает ai.request_timeout, поэтому правка cvar'а из консоли на борга не влияла.
  timeoutSeconds: 600
  reportsCache: true

# ChatGPT по подписке, через локальный мост CLIProxyAPI (порт 8317 — его значение по умолчанию).
#
# ПРОФИЛЬ НЕ РАБОТАЕТ: CLIProxyAPI на этой машине не установлен (каталога ~/.cli-proxy-api/ нет,
# порт 8317 не слушает никто), поэтому звено `codex` в цепочке — это гарантированный отказ и
# переход к следующему. Оставлен записью, а не удалён, потому что порт за ним закреплён: наш
# собственный мост к Grok сознательно занял 8318, чтобы эти двое разошлись без конфликта, когда
# ChatGPT-мост однажды поднимут.
#
# Почему через мост, а не напрямую: доступ по подписке — это не /v1/chat/completions, а
# https://chatgpt.com/backend-api/codex с Responses API и только стримом, плюс одноразовый
# ротирующийся refresh-токен. Два потребителя одного аккаунта ломают друг друга гарантированно —
# на этой машине это уже случилось (см. README, правило единственного владельца кредов).
#
# `proxy: None` здесь верно: до моста идти по loopback, а немецкий выход несёт сам мост своим
# дроп-ином systemd. Отправить loopback в SOCKS — значит подвесить запрос.
#
# `reportsCache: false` — сообщает ли мост cached_tokens, неизвестно, а соврать в эту сторону
# значит заставить алярм префикс-кэша кричать ERROR на каждом ходу без всякой поломки. Поменять на
# true можно, когда в журнале появятся ненулевые cache-значения от этого профиля.
- type: aiLlmProfile
  id: codex
  endpoint: http://127.0.0.1:8317/v1
  model: gpt-5.6-luna
  dialect: OpenAiCompat
  quota: Subscription
  proxy: None
  ctxLimit: 128000
  compactHigh: 100000
  timeoutSeconds: 150
  reportsCache: false
  reasoningEffort: low
  # Пять часов — окно Codex. Число не ограничивает нас, а только задаёт, за какой период считать
  # расход: потолка OpenAI не публикует, и `aiagent llm` — единственный способ его узнать.
  quotaWindowHours: 5

# Grok по подписке SuperGrok / X Premium+, через НАШ мост — `Tools/grokbridge`, порт 8318.
#
# Почему свой мост, а не прямой адрес: подписка отвечает не по /v1/chat/completions, а по
# https://cli-chat-proxy.grok.com/v1, требует двух своих заголовков (маршрут выбирается
# заголовком `x-grok-model-override`, а не полем model в теле), отдаёт только поток и живёт на
# OIDC-токене в шесть часов. Наш клиент не умеет ни первого, ни второго, ни третьего — см.
# разбор в Tools/grokbridge/README.md.
#
# Вход — активацией устройством (RFC 8628), у моста своя сессия в ai_data/grok.session.json.
# Это и есть соблюдение правила единственного владельца кредов: `grok` в терминале и игровой
# сервер обновляют РАЗНЫЕ refresh-токены и потому не отзывают их друг у друга.
#
# `keyFile` здесь — ключ НАШЕГО моста, а не подписки: loopback на этой машине общий с другими
# пользователями, и мост без ключа означал бы чужой расход недельной квоты.
#
# Квота у Grok — один недельный пул, общий на все продукты Grok, и xAI не публикует о нём вообще
# ничего. Поэтому окно здесь недельное: считать пятичасовыми отрезками то, что тратится неделей,
# значит получить бесполезное число.
- type: aiLlmProfile
  id: grok
  endpoint: http://127.0.0.1:8318/v1
  model: grok-4.5
  dialect: OpenAiCompat
  quota: Subscription
  proxy: None
  keyFile: grok_bridge.key
  ctxLimit: 128000
  compactHigh: 100000
  # 60 с 01.09.2026, было 240. Причина в цепочке, а не в скорости моста: общий бюджет хода
  # `ai.llm_total_timeout` — те же 240, поэтому голова, зависнув на своём таймауте, съедала бюджет
  # ЦЕЛИКОМ и следующее звено не пробовалось вовсе (RoutingLlmClient.cs:174, «не пробовали, общий
  # бюджет исчерпан»). Ход при этом терялся полностью — так 01.09 ИИ молчал четыре минуты.
  # Четыре звена по 60 укладываются в 240 ровно. Свой потолок у моста — 300 секунд, и порядок
  # этих чисел важен: сдаться первым обязан игровой сервер, иначе в журнале останется обрыв
  # соединения вместо внятного таймаута с именем профиля.
  timeoutSeconds: 60
  reportsCache: false
  quotaWindowHours: 168

# Grok 4.6 — модель под режим злого ИИ, тем же мостом и той же сессией, что и 4.5.
#
# Отдельной записью, а не правкой модели у профиля `grok`, и это не про аккуратность. Профиль
# `grok` стоит в цепочках обычных смен; сменив ему модель, мы поменяли бы поведение агента там,
# где никто этого не просил, и заметили бы только по счетам. Здесь же нужен ровно обратный
# порядок: новая модель включается одному режиму, а откат на 4.5 остаётся снятием одного звена
# из цепочки, без правки прототипов.
#
# Квота общая с профилем `grok` — это один и тот же недельный пул xAI на все продукты Grok, и
# два профиля его НЕ удваивают. Окно тоже недельное по той же причине.
#
# ПРОВЕРИТЬ ПЕРЕД ИГРОЙ: `curl -s --noproxy '*' 127.0.0.1:8318/health` — мост скажет, до какого
# часа действует сессия. Мёртвая сессия не роняет раунд, но уводит его на следующее звено
# цепочки, то есть игра пройдёт не на той модели, и заметно это будет только по журналу.
- type: aiLlmProfile
  id: grok46
  endpoint: http://127.0.0.1:8318/v1
  model: grok-4.6
  dialect: OpenAiCompat
  quota: Subscription
  proxy: None
  keyFile: grok_bridge.key
  # 200000/170000 с 01.09.2026, было 128000/100000 (решение владельца). У Grok 4.6 окно 500k,
  # так что 200k — по-прежнему заниженное число в духе правила выше, а не край. Смысл в свёртке:
  # при пороге 100k четыре агента сворачивались каждые несколько минут, и каждая свёртка — это
  # молчание и полный prefill. У deepseek окно миллион, у него тот же порог; awq и glm остались
  # на 128k, и падение на них с промпта в 150k стоит одного потерянного хода — следующий
  # свернётся уже по их порогу. Это осознанный размен, а не недосмотр.
  ctxLimit: 200000
  compactHigh: 170000
  timeoutSeconds: 60
  reportsCache: false
  quotaWindowHours: 168
  # По умолчанию Grok 4.6 думает на `high` — это подтверждено замером, а не документацией:
  # одна и та же задача даёт 794-858 токенов размышления без поля и 653-847 с `high`, то есть
  # умолчание и есть `high`. С `low` — 233-243 токена и 4-7 секунд вместо 16-19.
  #
  # Форма поля важна. Игровой клиент шлёт ПЛОСКОЕ `reasoning_effort` (LlamaClient.cs:129,
  # диалект OpenAiCompat), и мост его пропускает — оно в FORWARDED_FIELDS. Текущая
  # документация xAI описывает вложенное `reasoning: {effort: ...}`; его мост отбрасывает
  # (в белом списке такого ключа нет), и замер это подтвердил: с вложенной формой размышление
  # осталось умолчанием. Не менять на вложенную форму, не расширив белый список моста.
  #
  # Тихий отказ — главная опасность этой настройки: неподдержанное поле уезжает молча, ответ
  # приходит с HTTP 200, и «поле не работает» неотличимо от «поле работает». Проверять только
  # замером reasoning_tokens, скрипт — scratchpad/grok-effort.py.
  reasoningEffort: low

# DeepSeek напрямую по API-ключу — платный резерв.
#
# Единственный профиль, которому легален объект `thinking`: это расширение DeepSeek, их же SDK
# прячет его в extra_body.
#
# Цены — за миллион токенов, пиковый тариф (в 01:00-04:00 и 06:00-10:00 UTC он вдвое ниже, и
# счётчик этого не знает, так что показанная сумма — верхняя оценка). Попадание в кэш стоит 3% от
# промаха, и при нашем медианном промпте 52.7k именно это определяет счёт, а не выдача.
#
# ПРО КЛЮЧ. Он лежит в ai_data/deepseek.key и однажды засветился в переписке. Ротация НЕ нужна —
# решение владельца от 20.08.2026: счёт под этим ключом сознательно держится на сумме, которой
# хватает на раунды в SS14 и не хватает, чтобы было больно. Прежнее предупреждение «не ставить в
# цепочку до замены ключа» снято этим же решением.
- type: aiLlmProfile
  id: deepseek
  endpoint: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  dialect: DeepSeek
  quota: Metered
  proxy: Socks
  keyFile: deepseek.key
  # 200000/170000 с 01.09.2026 — у deepseek-v4-flash окно миллион токенов (284B MoE, 13B
  # активных), так что 128000 здесь было запасом с огромным запасом. Держим то же число, что у
  # головы цепочки: иначе смена профиля посреди раунда меняла бы порог свёртки вдвое.
  ctxLimit: 200000
  compactHigh: 170000
  timeoutSeconds: 120
  reportsCache: true
  # `off`, а не `low`, с 01.09.2026 (решение владельца). У диалекта DeepSeek это НЕ «пониже
  # уровень»: ThinkingRequest.Build отдаёт объект `thinking: {"type":"disabled"}`, то есть
  # размышление выключается целиком. Заодно снимается старая грабля: в thinking-режиме DeepSeek
  # требует возвращать `reasoning_content` следующим запросом, а в Llm/ этого нет — отсюда были
  # HTTP 400 «must be passed back to the API» 31.08.
  #
  # Не путать с профилями строгого OpenAI: там `off` вообще не значение, и то же слово у них
  # означает «поля не слать» (ReasoningEffortRequest). Перевод сидит в коде, не в конфиге.
  reasoningEffort: off
  priceInPer1M: 0.44
  priceCachedInPer1M: 0.014
  priceOutPer1M: 1.32


# Старший брат того же вендора: deepseek-v4-pro.
#
# Заведён 01.09.2026 как ПРОБА для станционного ИИ — у боргов остаётся flash. Причина в том,
# что роль ведёт именно ядро: борг исполняет короткие приказы и от лишнего ума не выигрывает,
# а Аксиома держит план на полтора часа, врёт экипажу и командует семерыми.
#
# Идентификатор сверен с `GET /v1/models` живым ключом, а не взят из статьи: вендор отдаёт ровно
# три — `deepseek-v4-flash`, `deepseek-v4-pro`, `deepseek-v4-flash-vision-exp`.
#
# ДЕНЬГИ. Вопреки названию, pro у этого вендора ДЕШЕВЛЕ flash по всем трём строкам: вход 0.435
# против 0.44, выдача 0.87 против 1.32, попадание в кэш 0.0036 против 0.014. Последнее и решает:
# у нас кэш попадает под 90%, и счёт живёт этой строкой, а не выдачей. Проба ожидается дешевле
# нынешнего, но проверять надо по `aiagent llm`, а не по ожиданиям — цены вендор меняет, и в
# конфиге они всего лишь наша копия.
#
# Размышление выключено по той же причине, что у flash (см. выше): возвращать
# `reasoning_content` в следующем запросе наш клиент не умеет.
- type: aiLlmProfile
  id: deepseek-pro
  endpoint: https://api.deepseek.com/v1
  model: deepseek-v4-pro
  dialect: DeepSeek
  quota: Metered
  proxy: Socks
  keyFile: deepseek.key
  ctxLimit: 200000
  compactHigh: 170000
  # 180, а не 120: модель крупнее и на длинном промпте отвечает дольше. Общий бюджет хода
  # `ai.llm_total_timeout` — 240, так что 180 всё ещё оставляет место следующему звену.
  timeoutSeconds: 180
  reportsCache: true
  reasoningEffort: off
  priceInPer1M: 0.435
  priceCachedInPer1M: 0.0036
  priceOutPer1M: 0.87


# ЗАПАСНОЙ ПУТЬ НА СВОЁМ ЖЕЛЕЗЕ: Qwen3.8-27B в AWQ INT4 под vLLM, через llama-swap.
#
# Заведён 20.08.2026 по решению владельца: боевая цепочка агентов идёт на deepseek-v4-flash,
# и если тот отвалится — по сети, по лимиту или по деньгам, — раунд должен продолжаться, а не
# встать с четырьмя молчащими агентами. Ставится ВТОРЫМ звеном, а не первым: deepseek заметно
# быстрее на ходу и дешевле по времени раунда, локальная модель — страховка.
#
# `dialect: OpenAiCompat`, а не LlamaCpp, и это не мелочь. За llama-swap здесь стоит vLLM, а он
# строгий: top_k, min_p, cache_prompt и id_slot — это расширения llama.cpp, и на них vLLM
# отвечает отказом, а не молчаливым игнорированием. Диалект LlamaCpp здесь дал бы 400 на каждом
# ходу.
#
# `ctxProbe: None`, потому что /props умеет только llama-server. Число берётся из ctxLimit и
# обязано совпадать с --max-model-len в /home/rewin/vllm-swap-qwen38-awq.sh: соврать в большую
# сторону значит получить отказ по переполнению посреди раунда, в меньшую — компактиться раньше,
# чем нужно.
#
# ТАЙМАУТ БОЛЬШОЙ, И ЭТО ПРО ПЕРВЫЙ ХОД. llama-swap поднимает модель по требованию, а поднять
# контейнер vLLM с 20 ГБ весов — это минуты, не секунды. Первый ход после переключения с deepseek
# упрётся именно в это, и короткий таймаут превратил бы страховку в гарантированный отказ: ход
# терялся бы, провайдер уходил в кулдаун, и цепочка обошла бы единственное живое звено.
#
# `quota: Free` — счёт за своё железо не выставляется, и в `aiagent cost` эта строка обязана
# стоять нулём, иначе разбор раунда врёт про деньги.
- type: aiLlmProfile
  id: awq
  endpoint: http://127.0.0.1:9292/v1
  model: qwen3.8-27b-awq
  dialect: OpenAiCompat
  quota: Free
  proxy: None
  ctxProbe: None
  ctxLimit: 131072
  compactHigh: 100000
  timeoutSeconds: 900
  reportsCache: false
  # Выключено 31.08.2026, решение владельца: киборги идут на эту модель, и размышление
  # на INT4 жрёт секунды хода, не давая качества, которое видно в рации. `off` не шлёт
  # reasoning_effort (у OpenAI нет такого значения) и кладёт enable_thinking:false в
  # шаблон vLLM — иначе Qwen3 открывает <think> по умолчанию.
  reasoningEffort: off

# OpenRouter: Z.ai GLM-5.3-Flash. Посажен 31.08.2026 по решению владельца.
#
# Прямой OpenAI-совместимый вход, не мост: https://openrouter.ai/api/v1/chat/completions,
# модель `z-ai/glm-5.3-flash`. Диалект OpenAiCompat — иначе top_k/min_p/thinking уедут в
# тело и OpenRouter ответит 400.
#
# SOCKS — тот же немецкий выход, что у DeepSeek: с этой машины api.openrouter.ai без него
# не открывается. Loopback сюда не ходит, `proxy: None` подвесил бы запрос так же, как
# подвесил бы DeepSeek.
#
# Окно вендора — миллион токенов. Стоит 128000 по общему правилу облачных профилей:
# завысить значит получить отказ посреди раунда, занизить — только компактиться чаще.
# Поднимать после сверки с живым ответом, не по карточке модели.
#
# Цены — верхняя оценка по стандартному прайсу OpenRouter ($0.15 / $0.50 / кэш $0.03
# за миллион), не по скидке Relace и не по средневзвешенному: `aiagent cost` врёт
# в безопасную сторону. Кэш OpenRouter в не-стриме сообщает не всегда, поэтому
# reportsCache: false — иначе алярм префикс-кэша орёт на каждом ходу без поломки.
- type: aiLlmProfile
  id: glm
  endpoint: https://openrouter.ai/api/v1
  model: z-ai/glm-5.3-flash
  dialect: OpenAiCompat
  quota: Metered
  proxy: Socks
  keyFile: openrouter.key
  ctxLimit: 128000
  compactHigh: 100000
  timeoutSeconds: 120
  reportsCache: false
  reasoningEffort: low
  priceInPer1M: 0.15
  priceCachedInPer1M: 0.03
  priceOutPer1M: 0.50
