# Провайдеры модели. Порядок задаётся НЕ здесь, а в `ai.llm_chain`.
#
# Читает RoutingLlmClient; описание полей — в Llm/AiLlmProfilePrototype.cs. Здесь только набор
# доступных провайдеров; кто из них главный и в каком порядке идут фаллбеки — операционное решение,
# и меняется оно командой `cvar ai.llm_chain "codex,grok,deepseek,local"` на живом сервере.
#
# Пустой `ai.llm_chain` — рабочий режим, а не «не настроено»: тогда агент работает по одиночному
# `ai.endpoint`, как до появления профилей. Это и есть откат, если цепочка сломает раунд.
#
# ---------------------------------------------------------------------------------------------
# СЕКРЕТОВ ЗДЕСЬ БЫТЬ НЕ МОЖЕТ. Content.Server/Acz/ContentMagicAczProvider.cs раздаёт всю папку
# Resources/ каждому подключившемуся игроку — ключ, положенный в этот файл, уехал бы к первому же
# зашедшему. Поэтому `keyFile` — это ИМЯ файла внутри ai.data_dir, а не значение.
#
# ---------------------------------------------------------------------------------------------
# ПРО `ctxLimit`: РИСК НЕСИММЕТРИЧЕН, И ЧИСЛА ЗДЕСЬ СОЗНАТЕЛЬНО ЗАНИЖЕНЫ.
#
# Завысить — значит позволить диалогу вырасти за настоящее окно провайдера, и тогда ход кончается
# HTTP-ошибкой, а в журнале до самого отказа виден здоровый размер промпта. Занизить — значит лишь
# компактиться чаще, чем нужно, то есть терять историю, но не раунд. Поэтому у облачных профилей
# стоит 128000 независимо от того, что обещает вендор, и поднимать это следует по факту: сверить с
# `GET /v1/models` у моста и с документацией провайдера, а не по статье в интернете.
#
# У локального профиля числа нет вовсе — там `ctxProbe: Props`, и llama-server сообщает настоящий
# n_ctx сам. Это единственный провайдер, который умеет отвечать на такой вопрос.
# ---------------------------------------------------------------------------------------------

# Локальная модель. Последний рубеж цепочки: работает, когда нет ни интернета, ни моста.
#
# `dialect: LlamaCpp` — единственный, кому легально уходят top_k, min_p, cache_prompt и id_slot.
# Уровень размышления здесь НЕ настраивается из игры: он задан флагом запуска llama-server
# `--chat-template-kwargs '{"reasoning_effort":"low"}'`, а поле в теле запроса llama.cpp принимает
# и молча игнорирует. Поэтому `reasoningEffort` тут пуст — настройка, которая выглядит рабочей и не
# делает ничего, хуже отсутствующей.
- type: aiLlmProfile
  id: local
  endpoint: http://127.0.0.1:9292/v1
  model: qwen3.8-27b-q8
  dialect: LlamaCpp
  quota: Free
  proxy: None
  ctxProbe: Props
  # 600, а не 180 (19.08.2026): на контексте под 100k один ход борга занимал 177 с чистой
  # генерации (7849 токенов размышления), и прежний потолок рубил ровно те ходы, которые
  # дороже всего обошлись — ход терялся, провайдер уходил в кулдаун, робот стоял и разряжался.
  # Профиль перебивает ai.request_timeout, поэтому правка cvar'а из консоли на борга не влияла.
  timeoutSeconds: 600
  reportsCache: true

# ChatGPT по подписке, через локальный мост CLIProxyAPI (порт 8317 — его значение по умолчанию).
#
# ПРОФИЛЬ НЕ РАБОТАЕТ: CLIProxyAPI на этой машине не установлен (каталога ~/.cli-proxy-api/ нет,
# порт 8317 не слушает никто), поэтому звено `codex` в цепочке — это гарантированный отказ и
# переход к следующему. Оставлен записью, а не удалён, потому что порт за ним закреплён: наш
# собственный мост к Grok сознательно занял 8318, чтобы эти двое разошлись без конфликта, когда
# ChatGPT-мост однажды поднимут.
#
# Почему через мост, а не напрямую: доступ по подписке — это не /v1/chat/completions, а
# https://chatgpt.com/backend-api/codex с Responses API и только стримом, плюс одноразовый
# ротирующийся refresh-токен. Два потребителя одного аккаунта ломают друг друга гарантированно —
# на этой машине это уже случилось (см. README, правило единственного владельца кредов).
#
# `proxy: None` здесь верно: до моста идти по loopback, а немецкий выход несёт сам мост своим
# дроп-ином systemd. Отправить loopback в SOCKS — значит подвесить запрос.
#
# `reportsCache: false` — сообщает ли мост cached_tokens, неизвестно, а соврать в эту сторону
# значит заставить алярм префикс-кэша кричать ERROR на каждом ходу без всякой поломки. Поменять на
# true можно, когда в журнале появятся ненулевые cache-значения от этого профиля.
- type: aiLlmProfile
  id: codex
  endpoint: http://127.0.0.1:8317/v1
  model: gpt-5.6-luna
  dialect: OpenAiCompat
  quota: Subscription
  proxy: None
  ctxLimit: 128000
  compactHigh: 100000
  timeoutSeconds: 150
  reportsCache: false
  reasoningEffort: low
  # Пять часов — окно Codex. Число не ограничивает нас, а только задаёт, за какой период считать
  # расход: потолка OpenAI не публикует, и `aiagent llm` — единственный способ его узнать.
  quotaWindowHours: 5

# Grok по подписке SuperGrok / X Premium+, через НАШ мост — `Tools/grokbridge`, порт 8318.
#
# Почему свой мост, а не прямой адрес: подписка отвечает не по /v1/chat/completions, а по
# https://cli-chat-proxy.grok.com/v1, требует двух своих заголовков (маршрут выбирается
# заголовком `x-grok-model-override`, а не полем model в теле), отдаёт только поток и живёт на
# OIDC-токене в шесть часов. Наш клиент не умеет ни первого, ни второго, ни третьего — см.
# разбор в Tools/grokbridge/README.md.
#
# Вход — активацией устройством (RFC 8628), у моста своя сессия в ai_data/grok.session.json.
# Это и есть соблюдение правила единственного владельца кредов: `grok` в терминале и игровой
# сервер обновляют РАЗНЫЕ refresh-токены и потому не отзывают их друг у друга.
#
# `keyFile` здесь — ключ НАШЕГО моста, а не подписки: loopback на этой машине общий с другими
# пользователями, и мост без ключа означал бы чужой расход недельной квоты.
#
# Квота у Grok — один недельный пул, общий на все продукты Grok, и xAI не публикует о нём вообще
# ничего. Поэтому окно здесь недельное: считать пятичасовыми отрезками то, что тратится неделей,
# значит получить бесполезное число.
- type: aiLlmProfile
  id: grok
  endpoint: http://127.0.0.1:8318/v1
  model: grok-4.5
  dialect: OpenAiCompat
  quota: Subscription
  proxy: None
  keyFile: grok_bridge.key
  ctxLimit: 128000
  compactHigh: 100000
  # 240, а не 150: мост собирает ответ из потока целиком и отдаёт его одним куском, поэтому
  # рассуждающая модель молчит всё время размышления. Свой потолок у моста — 300 секунд, и
  # порядок этих двух чисел важен: сдаться первым должен игровой сервер, иначе в журнале
  # останется обрыв соединения вместо внятного таймаута с именем профиля.
  timeoutSeconds: 240
  reportsCache: false
  quotaWindowHours: 168

# Grok 4.6 — модель под режим злого ИИ, тем же мостом и той же сессией, что и 4.5.
#
# Отдельной записью, а не правкой модели у профиля `grok`, и это не про аккуратность. Профиль
# `grok` стоит в цепочках обычных смен; сменив ему модель, мы поменяли бы поведение агента там,
# где никто этого не просил, и заметили бы только по счетам. Здесь же нужен ровно обратный
# порядок: новая модель включается одному режиму, а откат на 4.5 остаётся снятием одного звена
# из цепочки, без правки прототипов.
#
# Квота общая с профилем `grok` — это один и тот же недельный пул xAI на все продукты Grok, и
# два профиля его НЕ удваивают. Окно тоже недельное по той же причине.
#
# ПРОВЕРИТЬ ПЕРЕД ИГРОЙ: `curl -s --noproxy '*' 127.0.0.1:8318/health` — мост скажет, до какого
# часа действует сессия. Мёртвая сессия не роняет раунд, но уводит его на следующее звено
# цепочки, то есть игра пройдёт не на той модели, и заметно это будет только по журналу.
- type: aiLlmProfile
  id: grok46
  endpoint: http://127.0.0.1:8318/v1
  model: grok-4.6
  dialect: OpenAiCompat
  quota: Subscription
  proxy: None
  keyFile: grok_bridge.key
  ctxLimit: 128000
  compactHigh: 100000
  timeoutSeconds: 240
  reportsCache: false
  quotaWindowHours: 168

# DeepSeek напрямую по API-ключу — платный резерв.
#
# Единственный профиль, которому легален объект `thinking`: это расширение DeepSeek, их же SDK
# прячет его в extra_body.
#
# Цены — за миллион токенов, пиковый тариф (в 01:00-04:00 и 06:00-10:00 UTC он вдвое ниже, и
# счётчик этого не знает, так что показанная сумма — верхняя оценка). Попадание в кэш стоит 3% от
# промаха, и при нашем медианном промпте 52.7k именно это определяет счёт, а не выдача.
#
# ВНИМАНИЕ: ключ в ai_data/deepseek.key помечен в README как утёкший в чат и не ротированный.
# Ставить этот профиль в ai.llm_chain до замены ключа нельзя.
- type: aiLlmProfile
  id: deepseek
  endpoint: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  dialect: DeepSeek
  quota: Metered
  proxy: Socks
  keyFile: deepseek.key
  ctxLimit: 128000
  compactHigh: 100000
  timeoutSeconds: 120
  reportsCache: true
  reasoningEffort: low
  priceInPer1M: 0.44
  priceCachedInPer1M: 0.014
  priceOutPer1M: 1.32
