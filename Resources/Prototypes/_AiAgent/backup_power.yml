# Резервное питание по станциям. Ключ — id прототипа gameMap.
#
# Читает BackupPowerSystem; описание формата — в AiBackupPowerPrototype.cs. Записи может не быть:
# апстрим добавляет карты, и новая попадёт в ротацию раньше, чем ей заведут строку. Тогда система
# берёт мощность из ai.backup_power_watts и ищет место общим способом. Таблица нужна лишь затем,
# чтобы на известных картах числа были соразмерны станции, а не одинаковы для всех.
#
# ЭТО НЕ ПАТЧ КАРТ. Resources/Maps/*.yml — апстримовые файлы, форк их не трогает; вписанные в карту
# генераторы исчезли бы при первом ребейзе, а таблица переживает любое обновление.
#
# ---------------------------------------------------------------------------------------------
# ОТКУДА ЧИСЛА. Каждую карту разобрал отдельный проход по её YAML: граф высоковольтного кабеля,
# связные компоненты, SMES по компонентам, свободные тайлы, батареи, APC, солнечные панели, маяки.
#
# `watts` = APC × 1200 Вт, округлённо до 5000, в пределах [30000, 120000].
#
# **1200 Вт на APC — это ПРОКСИ, а не замер.** APC примерно соответствует одному запитанному
# помещению, 1200 Вт — грубая оценка его нагрузки на малолюдной смене. Настоящее потребление
# меряется в бою командой `powerstat`; до замера эти числа хотя бы соразмерны станции. Опорные
# цифры апстримового гайдбука (батарей на 5-10 минут, отсюда 340-670 кВт) написаны для ПОЛНОГО
# экипажа и здесь не годятся.
#
# `anchors` — мягкое предпочтение, куда ставить: система всё равно выбирает тайл главной сети, а
# список лишь решает, какой участок перебрать первым. Сравнение по вхождению подстроки без учёта
# регистра, и сравнивается с ЛОКАЛИЗОВАННЫМ текстом маяка, а не с id прототипа: маяк
# `DefaultStationBeaconPowerBank` показывает «SMES», поэтому «PowerBank» не совпал бы никогда.
# «CE» в список не ставить — подстрока попадёт и в «Science».
#
# Что разбор попутно установил и что стоит помнить:
#
#   * Солнечных панелей на главной сети НЕТ на одиннадцати картах из тринадцати. Исключения —
#     Oasis (70 панелей) и Tram2 (20). Остальные массивы стоят на изолированных кабельных островах
#     и на старте раунда не дают ничего, сколько бы киловатт ни было на табличке.
#   * Банки SMES почти везде обставлены кабельными терминалами и катwalk'ами вплотную. Первая
#     версия системы искала место только рядом с SMES и на Sushi нашла НОЛЬ тайлов — то есть молча
#     не поставила бы ничего. Поиск по всей главной сети это снял.
#   * На нескольких картах есть SMES, стоящие вообще без кабеля под ними (Exo, Serpentcrest,
#     Bagel, Fland): их запас недостижим, и в общий котёл он не идёт.
# ---------------------------------------------------------------------------------------------

# Единственная карта при онлайне 0-4, то есть основная цель. 89 APC, 202 МДж запаса,
# 98 кВт солнечного номинала — целиком на островах.
#
# ПОДНЯТО 105000 -> 150000 (три машины по 50 кВт) 2026-08-17 по наблюдению в бою: на 105 кВт
# заряд SMES медленно садился. Это первое число здесь, полученное НАБЛЮДЕНИЕМ, а не прокси
# «APC × 1200», и оно показывает, что прокси занижает: 89 APC давали 105 кВт, реальность
# запросила больше. Остальные карты остаются на прокси, пока их не проверят так же.
- type: aiBackupPower
  id: Packed
  watts: 150000
  anchors: [ SMES, Engineering, PA Control ]

# Вторая по очереди (5-24 игрока). 82 APC. Свободные тайлы у инженерного банка отсутствуют вовсе,
# поэтому «AI Power» стоит первым: там место есть, и ядру ИИ питание нужнее всего.
- type: aiBackupPower
  id: Snowball
  watts: 100000
  anchors: [ AI Power, PA Control, Engineering ]

# 109 APC, 187 МДж. Прокси даёт 130 кВт, потолок срезает до 120.
- type: aiBackupPower
  id: Elkridge
  watts: 120000
  anchors: [ SMES, Engineering ]

# 91 APC, 244 МДж. 326 панелей (244 кВт) — все до одной на островах.
- type: aiBackupPower
  id: Plasma
  watts: 110000
  anchors: [ SMES, Engineering ]

# 107 APC. Прокси 128 кВт, срезан потолком. Пять SMES вне главной сети.
- type: aiBackupPower
  id: Box
  watts: 120000
  anchors: [ SMES, Engineering, Telecoms ]

# 65 APC. Два SMES стоят на голом полу без кабеля — 16 МДж из заявленных 208 недостижимы.
- type: aiBackupPower
  id: Exo
  watts: 80000
  anchors: [ SMES, Engineering ]

# 79 APC. Инженерный банк заперт наглухо; три SMES вне любой сети.
- type: aiBackupPower
  id: Bagel
  watts: 95000
  anchors: [ SMES, Engineering, GravGen ]

# 67 APC. Два SMESBasicEmpty на главной сети дают ноль джоулей, так что «17 SMES» завышено.
- type: aiBackupPower
  id: Marathon
  watts: 80000
  anchors: [ SMES, Engineering, Telecoms ]

# 48 APC — самая скромная станция в ротации. Одна из двух карт, где солнце УЖЕ в главной сети
# (70 панелей из 230), поэтому запас мощности здесь нужен меньший.
- type: aiBackupPower
  id: Oasis
  watts: 60000
  anchors: [ SMES, Engineering, AME ]

# 88 APC. Именно на этой карте первая версия поиска давала ноль мест: 47 кабельных терминалов
# вокруг SMES. Оставлено как напоминание, почему поиск идёт по сети, а не по соседям.
- type: aiBackupPower
  id: Sushi
  watts: 105000
  anchors: [ SMES, Engineering, Telecoms ]

# 93 APC. Две сетки: станция и трам. SMES живут только на станции, так что генератор на
# движущуюся сетку попасть не может. Вторая карта, где часть солнца (20 панелей) в главной сети.
- type: aiBackupPower
  id: Tram2
  watts: 110000
  anchors: [ SMES, Engineering, PA Control ]

# 105 APC. Прокси 126 кВт, срезан потолком. Два SMESAdvancedEmpty стоят без кабеля.
- type: aiBackupPower
  id: Serpentcrest
  watts: 120000
  anchors: [ SMES, AME, Engineering ]

# 128 APC — крупнейшая станция (70+ игроков). Прокси 154 кВт, потолок срезает до 120: здесь
# ограничение чувствуется сильнее всего, и если карта когда-нибудь встанет в ротацию всерьёз,
# число надо мерить, а не выводить.
- type: aiBackupPower
  id: Fland
  watts: 120000
  anchors: [ Engi Gear, Engine, Access Corridor ]
