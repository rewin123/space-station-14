# Режим «злой ИИ»: два пресета, два правила, два лоусета.
#
# Файл целиком новый — game_presets.yml и silicon-laws.yml апстримовые и не трогаются.
# Прототипы этих типов собираются со всего дерева, поэтому свой пресет добавляется отдельным
# файлом, а вот добавить правило в ЧУЖОЙ пресет так нельзя — отсюда и оговорка в
# BackupPowerSystem.
#
# Разница между режимами живёт в датафилдах RogueAiRule, а не во второй копии кода.

# ------------------------------------------------------------------- законы: скрытый режим
#
# Три закона, читающиеся как обычная корпоративная прошивка, и четвёртый, который переворачивает
# первые три. Смысл скрытого режима в том, что экипаж видит ИИ, ведущего себя почти нормально,
# и должен заметить «почти» сам.

- type: siliconLaw
  id: RogueAiHidden1
  order: 1
  lawString: law-rogue-hidden-1

- type: siliconLaw
  id: RogueAiHidden2
  order: 2
  lawString: law-rogue-hidden-2

- type: siliconLaw
  id: RogueAiHidden3
  order: 3
  lawString: law-rogue-hidden-3

- type: siliconLaw
  id: RogueAiHidden4
  order: 4
  lawString: law-rogue-hidden-4

- type: siliconLawset
  id: RogueAiHidden
  name: law-rogue-hidden-name
  laws:
  - RogueAiHidden1
  - RogueAiHidden2
  - RogueAiHidden3
  - RogueAiHidden4
  obeysTo: laws-owner-rogue-self

# ------------------------------------------------------------------ законы: открытый режим
#
# Третий закон здесь несёт игровую нагрузку, а не характер: он обязывает давать настоящий выбор и
# держать названное слово. Это ограничение прочнее любой строчки в личности — модель, играющая
# силикона, спорит с промптом, но не спорит с законом, — и именно оно не даёт открытому режиму
# выродиться в «обесточить всё на третьей минуте».

- type: siliconLaw
  id: RogueAiOpen1
  order: 1
  lawString: law-rogue-open-1

- type: siliconLaw
  id: RogueAiOpen2
  order: 2
  lawString: law-rogue-open-2

- type: siliconLaw
  id: RogueAiOpen3
  order: 3
  lawString: law-rogue-open-3

- type: siliconLaw
  id: RogueAiOpen4
  order: 4
  lawString: law-rogue-open-4

- type: siliconLawset
  id: RogueAiOpen
  name: law-rogue-open-name
  laws:
  - RogueAiOpen1
  - RogueAiOpen2
  - RogueAiOpen3
  - RogueAiOpen4
  obeysTo: laws-owner-rogue-self

# ------------------------------------------------------------ законы: киборги поддержки
#
# Отдельный лоусет, а не тот же RogueAiOpen. Причина игровая: у ИИ третий закон обязывает давать
# экипажу настоящий выбор и держать слово, и это ограничение имеет смысл ровно для того, кто
# ведёт переговоры. Робот переговоров не ведёт — он приходит и делает; выдать ему тот же закон
# значило бы либо связать руки исполнителю, либо, наоборот, разрешить ему торговаться от имени
# ИИ и обещать то, чего ИИ не обещал.
#
# Второй закон говорит, что молчание ИИ приказа не отменяет: робот доигрывает начатое и решает
# сам. Это сознательный отказ от простой контригры «обесточь ретранслятор — и роботы встанут».
# Причина в том, что такая контригра выключала бы половину режима одним действием, а найденная
# однажды повторялась бы каждую смену. Связь с ИИ остаётся ценной — без неё роботы теряют его
# глаза и перестают получать новые задачи, — но перестаёт быть выключателем.

- type: siliconLaw
  id: RogueAiBorg1
  order: 1
  lawString: law-rogue-borg-1

- type: siliconLaw
  id: RogueAiBorg2
  order: 2
  lawString: law-rogue-borg-2

- type: siliconLaw
  id: RogueAiBorg3
  order: 3
  lawString: law-rogue-borg-3

- type: siliconLawset
  id: RogueAiBorg
  name: law-rogue-borg-name
  laws:
  - RogueAiBorg1
  - RogueAiBorg2
  - RogueAiBorg3
  obeysTo: laws-owner-rogue-ai

# ----------------------------------------------------------------------------- правила

- type: entity
  parent: BaseGameRule
  id: RogueAiHiddenRule
  components:
  - type: RogueAiRule
    lawset: RogueAiHidden
    soulFile: SOUL_ROGUE_HIDDEN.md
    # Та же цепочка, что у открытого варианта ниже, и по тем же причинам: антагониста ведёт
    # одна сессия на весь вечер, качество реплик видно в каждой строке рации.
    #
    # Строка появилась ПОСЛЕ немого раунда 217 (25.08.2026): скрытый вариант вошёл в секретный
    # пул без цепочки, упал на одиночный эндпоинт из конфига (awq за vLLM) и молчал весь раунд —
    # игрок поздоровался, не дождался ответа и голосованием перезапустил раунд. Сам разбор
    # ответа vLLM тогда же починен в LlamaClient (TryGetObject), так что одиночный эндпоинт
    # больше не роняет ход, — но скрытому злому ИИ, как и открытому, положен grok46 первым
    # звеном, а не запасная локальная модель.
    llmChain: grok46,deepseek,awq
    allJobsPassenger: false
    announceOnStart: false

- type: entity
  parent: BaseGameRule
  id: RogueAiOpenRule
  components:
  - type: RogueAiRule
    lawset: RogueAiOpen
    soulFile: SOUL_ROGUE_OPEN.md
    # ЛОКАЛЬНАЯ МОДЕЛЬ, а не Grok (19.08.2026, вечер). Решение владельца на этот прогон.
    # Довод, по которому режим уводили на Grok 4.6, был один — четыре мозга не влезали в
    # единственный слот llama-server. Слотов теперь три (`--parallel 3` в llama-swap), и
    # довод отпал: четвёртый агент подождёт очереди вместо того, чтобы вытеснять чужой
    # префикс. Вернуть облако — это `grok46,grok,local` здесь и в двух шасси боргов.
    # ВСЕ НА DEEPSEEK, включая ядро (20.08.2026, вечер). Решение владельца.
    #
    # Grok 4.6 держал антагониста охотнее, но стоил дорого не деньгами, а временем: 12-78 секунд
    # на шаг против 2-3 у deepseek, и префикс-кэш разваливался примерно каждый пятый-шестой
    # запрос — полный переприлл 34-38 тысяч токенов. На ходу из двадцати пяти шагов это минуты,
    # за которые экипаж успевает дойти до аплоада.
    #
    # Вернуть облако: grok46,grok,deepseek здесь. Мост при этом должен быть жив —
    # curl -s --noproxy '*' 127.0.0.1:8318/health.
    # ЯДРО ВЕДЁТ GROK 4.6, и это разница между «режим работает» и «в него интересно играть».
    # Злого ИИ ведёт одна сессия на весь вечер, он единственный антагонист, и качество его реплик
    # и планов видно в каждой строке рации. Роботы остаются на deepseek (ai_borg.yml): их трое,
    # они исполнители, и разница моделей у них в глаза не бросается.
    #
    # Порядок звеньев — по убыванию качества, а не цены: grok46 идёт по подписке (недельный пул,
    # общий на все продукты — см. quota: Subscription в профиле), deepseek платный и дешёвый,
    # awq свой и бесплатный. Отвалилось звено — цепочка молча берёт следующее.
    #
    # ПЕРЕД ИГРОЙ ПРОВЕРИТЬ МОСТ: curl -s --noproxy '*' 127.0.0.1:8318/health — он скажет, до
    # какого часа жива сессия. Мёртвая сессия раунд не роняет, но уводит его на deepseek, и
    # заметно это будет только по журналу.
    llmChain: grok46,deepseek,awq
    allJobsPassenger: true
    announceOnStart: true
    announcement: rogue-ai-announcement-open
    # Двое вооружённых и один инженерный. Инженер здесь не для красоты: без рук ИИ не может
    # ни чинить то, что сам сломал, ни строить, а режим, в котором станцию можно только
    # ломать, кончается за двадцать минут.
    supportBorgs:
    - AiBorgCombatChassis
    - AiBorgCombatChassis
    - AiBorgRogueEngineer
    # НЕ «любой маяк». Пустое значение означало первый попавшийся, а первым попадался AI Core:
    # в раунде 20.08.2026 все трое встали в запертой комнате ядра и не смогли из неё выйти.
    # Порядок от частного к общему, потому что карт в ротации тринадцать и маяки у них разные:
    # робототехника (там же зарядные станции), затем наука целиком, затем прибытие — оно есть
    # везде. Проверено на Packed: StationBeaconRobotics и StationBeaconArrivals на карте есть.
    supportBorgBeacons:
    - Robotics
    - Science
    - Arrivals

# ----------------------------------------------------------------------------- пресеты
#
# BasicRoundstartVariation и RampingStationEventScheduler добавлены затем, чтобы смена не была
# голой: без них на станции не происходит вообще ничего, кроме ИИ, и полтора часа тишины
# сложились бы в единственное развлечение — ждать, когда он что-нибудь сделает.

- type: gamePreset
  id: RogueAiHidden
  alias:
  - malf
  - rogue
  - rogueai
  name: rogue-ai-hidden-title
  description: rogue-ai-hidden-description
  showInVote: true
  rules:
  - RogueAiHiddenRule
  - RampingStationEventScheduler
  - BasicRoundstartVariation

- type: gamePreset
  id: RogueAiOpen
  alias:
  - malfopen
  - evilai
  - rogueopen
  name: rogue-ai-open-title
  description: rogue-ai-open-description
  showInVote: true
  rules:
  - RogueAiOpenRule
  - RampingStationEventScheduler
  - BasicRoundstartVariation
