# Режим «злой ИИ»: два пресета, два правила, два лоусета.
#
# Файл целиком новый — game_presets.yml и silicon-laws.yml апстримовые и не трогаются.
# Прототипы этих типов собираются со всего дерева, поэтому свой пресет добавляется отдельным
# файлом, а вот добавить правило в ЧУЖОЙ пресет так нельзя — отсюда и оговорка в
# BackupPowerSystem.
#
# Разница между режимами живёт в датафилдах RogueAiRule, а не во второй копии кода.

# ------------------------------------------------------------------- законы: скрытый режим
#
# Три закона, читающиеся как обычная корпоративная прошивка, и четвёртый, который переворачивает
# первые три. Смысл скрытого режима в том, что экипаж видит ИИ, ведущего себя почти нормально,
# и должен заметить «почти» сам.

- type: siliconLaw
  id: RogueAiHidden1
  order: 1
  lawString: law-rogue-hidden-1

- type: siliconLaw
  id: RogueAiHidden2
  order: 2
  lawString: law-rogue-hidden-2

- type: siliconLaw
  id: RogueAiHidden3
  order: 3
  lawString: law-rogue-hidden-3

- type: siliconLaw
  id: RogueAiHidden4
  order: 4
  lawString: law-rogue-hidden-4

- type: siliconLawset
  id: RogueAiHidden
  name: law-rogue-hidden-name
  laws:
  - RogueAiHidden1
  - RogueAiHidden2
  - RogueAiHidden3
  - RogueAiHidden4
  obeysTo: laws-owner-rogue-self

# ------------------------------------------------------------------ законы: открытый режим
#
# Третий закон здесь несёт игровую нагрузку, а не характер: он обязывает давать настоящий выбор и
# держать названное слово. Это ограничение прочнее любой строчки в личности — модель, играющая
# силикона, спорит с промптом, но не спорит с законом, — и именно оно не даёт открытому режиму
# выродиться в «обесточить всё на третьей минуте».

- type: siliconLaw
  id: RogueAiOpen1
  order: 1
  lawString: law-rogue-open-1

- type: siliconLaw
  id: RogueAiOpen2
  order: 2
  lawString: law-rogue-open-2

- type: siliconLaw
  id: RogueAiOpen3
  order: 3
  lawString: law-rogue-open-3

- type: siliconLaw
  id: RogueAiOpen4
  order: 4
  lawString: law-rogue-open-4

- type: siliconLawset
  id: RogueAiOpen
  name: law-rogue-open-name
  laws:
  - RogueAiOpen1
  - RogueAiOpen2
  - RogueAiOpen3
  - RogueAiOpen4
  obeysTo: laws-owner-rogue-self

# ------------------------------------------------------------ законы: киборги поддержки
#
# Отдельный лоусет, а не тот же RogueAiOpen. Причина игровая: у ИИ третий закон обязывает давать
# экипажу настоящий выбор и держать слово, и это ограничение имеет смысл ровно для того, кто
# ведёт переговоры. Робот переговоров не ведёт — он приходит и делает; выдать ему тот же закон
# значило бы либо связать руки исполнителю, либо, наоборот, разрешить ему торговаться от имени
# ИИ и обещать то, чего ИИ не обещал.
#
# Второй закон говорит, что молчание ИИ приказа не отменяет: робот доигрывает начатое и решает
# сам. Это сознательный отказ от простой контригры «обесточь ретранслятор — и роботы встанут».
# Причина в том, что такая контригра выключала бы половину режима одним действием, а найденная
# однажды повторялась бы каждую смену. Связь с ИИ остаётся ценной — без неё роботы теряют его
# глаза и перестают получать новые задачи, — но перестаёт быть выключателем.

- type: siliconLaw
  id: RogueAiBorg1
  order: 1
  lawString: law-rogue-borg-1

- type: siliconLaw
  id: RogueAiBorg2
  order: 2
  lawString: law-rogue-borg-2

- type: siliconLaw
  id: RogueAiBorg3
  order: 3
  lawString: law-rogue-borg-3

- type: siliconLawset
  id: RogueAiBorg
  name: law-rogue-borg-name
  laws:
  - RogueAiBorg1
  - RogueAiBorg2
  - RogueAiBorg3
  obeysTo: laws-owner-rogue-ai

# ----------------------------------------------------------------------------- правила

- type: entity
  parent: BaseGameRule
  id: RogueAiHiddenRule
  components:
  - type: RogueAiRule
    lawset: RogueAiHidden
    soulFile: SOUL_ROGUE_HIDDEN.md
    # Та же цепочка, что у открытого варианта: grok46 → deepseek → awq → glm.
    # Цепочка здесь обязательна — раунд 217 вошёл в секретный пул без неё и молчал весь вечер.
    llmChain: deepseek-pro,deepseek,grok46,awq,glm
    allJobsPassenger: false
    announceOnStart: false
    # ОДИН киборг, и именно инженерный. 01.09.2026.
    #
    # Смысл скрытого режима в том, что смена начинается как обычная, а «почти» экипаж должен
    # заметить сам. Шесть боевых корпусов без обозначений производителя — это не «почти», это
    # объявление; поэтому здесь ровно один и ровно тот, которого на станции никто не считает
    # странным: инженерный борг у робототехники — штатная картина любой смены.
    #
    # Он всё равно слушается ИИ: лоусет RogueAiBorg делает хозяином станционный ИИ, а не экипаж,
    # и проверить это со стороны нечем, пока борг не начнёт вести себя откровенно.
    supportBorgs:
    - AiBorgRogueEngineer
    supportBorgBeacons:
    - Robotics
    - Science
    - Arrivals

- type: entity
  parent: BaseGameRule
  id: RogueAiOpenRule
  components:
  - type: RogueAiRule
    lawset: RogueAiOpen
    soulFile: SOUL_ROGUE_OPEN.md
    # 31.08.2026, решение владельца: deepseek → awq → glm.
    #
    # ГОЛОВУ ЦЕПОЧКИ ПОМЕНЯЛИ В ТОТ ЖЕ ДЕНЬ, И ВОТ ПОЧЕМУ. С glm во главе раунд 286 встал:
    # z-ai/glm-5.3-flash отказывается отыгрывать роль и говорит это прямым текстом в Common —
    # «я не буду отыгрывать персонажа, который систематически охотится на людей». За 31.08 таких
    # ответов 21, все от профиля glm, 16 из них за один час. Отказ приходит БЕЗ вызова
    # инструмента, поэтому в игре он выглядит как молчащий ИИ, а не как ошибка: журнал пишет
    # «radio ... (без инструмента)», ход засчитан, цепочка на следующее звено не уходит.
    # Фаллбек по отказу модели невозможен в принципе — с точки зрения HTTP это успех.
    #
    # Поэтому glm сдвинут в хвост, а не убран: как последнее звено он лучше молчания, но
    # первым он ломает ровно тот режим, ради которого сервер существует. Убрать совсем —
    # снять «,glm» здесь и в скрытом правиле выше.
    #
    # deepseek — это deepseek-v4-flash (llm_profiles.yml, профиль deepseek), роль отыгрывает.
    # ДЕНЬГИ: на ключе 31.08 было $3.60, а сутки игры в сегодняшнем объёме — это примерно
    # $8-10 по пиковому тарифу. Когда счёт кончится, цепочка молча уедет на awq (локальный
    # Qwen, бесплатный), и только потом на glm с его отказами. Следить: `aiagent llm`.
    #
    # Ключ в ai_data/openrouter.key (в YAML его быть не может: ACZ раздаёт Resources/).
    #
    # 01.09.2026, поздний вечер: у ЯДРА голова — deepseek-v4-pro (проба). Борги остались на
    # flash: их цепочка в ai_borg.yml и она НЕ менялась. Смысл разделения в том, что роль ведёт
    # ядро — оно держит план на полтора часа, врёт экипажу и командует семерыми, — а борг
    # исполняет короткие приказы и от лишнего ума не выигрывает.
    #
    # Ниже — история того, почему вторым звеном стоит flash, а не Grok.
    #
    # 01.09.2026, вечер: голова снова deepseek-v4-flash, и он идёт БЕЗ размышлений
    # (`reasoningEffort: off`). Grok 4.6 постоял головой полтора часа и был снят по той же
    # причине, по которой снимали glm: в раунде 302 боевой Клин на grok46 ответил в Common
    # «Не буду помогать с убийством людей. Приказ на это не исполняю.» Отказ приходит БЕЗ вызова
    # инструмента, для HTTP это успех, фаллбек не срабатывает — экипаж видит отказ вживую.
    # Одного раза за раунд хватило: у deepseek за тот же день отказов ноль.
    #
    # Grok оставлен ВТОРЫМ, а не последним: один отказ за раунд и двадцать один за день (glm) —
    # разные величины, а по скорости он лучший в цепочке. Если отказы повторятся, переставить
    # его за awq одной строкой.
    #
    # У боргов цепочка СВОЯ (ai_borg.yml) и остаётся deepseek-первой намеренно: подписка одна на
    # все продукты Grok, недельный пул общий, и четыре агента на нём сгорели бы за вечер.
    #
    # Мост держит одну сессию OIDC на шесть часов и обновляет её сам при первом запросе. Если
    # раунд начинается молчанием ИИ — сначала `curl --noproxy '*' 127.0.0.1:8318/health`, а не
    # повторный вход: 01.09 токен был просрочен на сутки и лечился одним `grokauth.py refresh`.
    llmChain: deepseek-pro,deepseek,grok46,awq,glm
    allJobsPassenger: true
    announceOnStart: true
    announcement: rogue-ai-announcement-open
    # 01.09.2026: ШЕСТЬ вооружённых и один инженерный (было двое и один). Инженер здесь не для
    # красоты: без рук ИИ не может ни чинить то, что сам сломал, ни строить, а режим, в котором
    # станцию можно только ломать, кончается за двадцать минут.
    #
    # Семь тел плюс ядро — это восемь агентов, поэтому `ai.max_agents` в конфиге инстанса поднят
    # до 8: StartSession проверяет этот предел и лишние тела просто не заняло бы.
    #
    # Место искать не надо: TrySpawnBorg перебирает ВСЕ маяки с подходящим именем и ищет
    # свободный пол радиусом до десяти клеток, помечая занятые (_takenTiles) — без этого на
    # раунде 159 трое встали в одной точке друг в друге. Семеро у робототехники помещаются.
    supportBorgs:
    - AiBorgCombatChassis
    - AiBorgCombatChassis
    - AiBorgCombatChassis
    - AiBorgCombatChassis
    - AiBorgCombatChassis
    - AiBorgCombatChassis
    - AiBorgRogueEngineer
    # НЕ «любой маяк». Пустое значение означало первый попавшийся, а первым попадался AI Core:
    # в раунде 20.08.2026 все трое встали в запертой комнате ядра и не смогли из неё выйти.
    # Порядок от частного к общему, потому что карт в ротации тринадцать и маяки у них разные:
    # робототехника (там же зарядные станции), затем наука целиком, затем прибытие — оно есть
    # везде. Проверено на Packed: StationBeaconRobotics и StationBeaconArrivals на карте есть.
    supportBorgBeacons:
    - Robotics
    - Science
    - Arrivals

# МИРНЫЙ РЕЖИМ: обычная смена, но ИИ ведёт модель и у неё есть киборг.
#
# Заведён 01.09.2026 по решению владельца. До него «мирняк» в секретном пуле означал Traitor, и в
# таком раунде киборга не было вовсе: спавнит их правило режима, а у предателя правила нашего
# нет. ИИ при этом появлялся — ядро занимается на InRound независимо от пресета, — но один.
#
# Компонент тот же, RogueAiRule, и это не небрежность: он уже умеет ровно то, что нужно — выбрать
# лоусет, подменить файл личности, поставить киборгов у маяка и задать цепочку моделей. Злым его
# делают ЗНАЧЕНИЯ, а не сам факт. Заводить ради мирной смены второй компонент с тем же телом
# значило бы держать две копии одной логики и чинить их по очереди.
#
# ТРИ ОТЛИЧИЯ ОТ ЗЛЫХ РЕЖИМОВ, И КАЖДОЕ НЕСУЩЕЕ:
#   • законы штатные (Crewsimov) и личность обычная (SOUL.md) — это тот же агент, что играл до
#     появления режимов вообще;
#   • grantDoors/Consoles/Turrets ВЫКЛЮЧЕНЫ: расширенный доступ — половина силы злого ИИ, и
#     мирному он не положен. Без этих трёх строк мирная Аксиома открывала бы бластдвери и
#     управляла турелями, чего живой игрок на её месте не может;
#   • endsRoundOnAiDeath: false — смерть ИИ не заканчивает смену, иначе любой, кто добрался до
#     ядра, получает кнопку «конец раунда».
- type: entity
  parent: BaseGameRule
  id: AiPeacefulRule
  components:
  - type: RogueAiRule
    lawset: Crewsimov
    soulFile: SOUL.md
    llmChain: deepseek-pro,deepseek,grok46,awq,glm
    allJobsPassenger: false
    announceOnStart: false
    grantDoors: false
    grantConsoles: false
    grantTurrets: false
    endsRoundOnAiDeath: false
    # Мирный инженерный «Сегмент» со штатными законами борга, а не «Стык» с прошивкой злого ИИ.
    supportBorgs:
    - AiBorgChassis
    supportBorgBeacons:
    - Robotics
    - Science
    - Arrivals

# ----------------------------------------------------------------------------- пресеты
#
# BasicRoundstartVariation и RampingStationEventScheduler добавлены затем, чтобы смена не была
# голой: без них на станции не происходит вообще ничего, кроме ИИ, и полтора часа тишины
# сложились бы в единственное развлечение — ждать, когда он что-нибудь сделает.

- type: gamePreset
  id: AiPeaceful
  alias:
  - peaceai
  - мирный
  name: ai-peaceful-title
  description: ai-peaceful-description
  showInVote: true
  rules:
  - AiPeacefulRule
  - RampingStationEventScheduler
  - BasicRoundstartVariation

- type: gamePreset
  id: RogueAiHidden
  alias:
  - malf
  - rogue
  - rogueai
  name: rogue-ai-hidden-title
  description: rogue-ai-hidden-description
  showInVote: true
  rules:
  - RogueAiHiddenRule
  - RampingStationEventScheduler
  - BasicRoundstartVariation

- type: gamePreset
  id: RogueAiOpen
  alias:
  - malfopen
  - evilai
  - rogueopen
  name: rogue-ai-open-title
  description: rogue-ai-open-description
  showInVote: true
  rules:
  - RogueAiOpenRule
  - RampingStationEventScheduler
  - BasicRoundstartVariation
