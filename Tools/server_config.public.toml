# Публичная конфигурация сервера «Аврора».
#
# ЭТО ИСТОЧНИК ИСТИНЫ. Рабочий файл — bin/Content.Server/server_config.toml — перезаписывается
# сборкой, поэтому правьте здесь и копируйте:
#
#   cp Tools/server_config.public.toml bin/Content.Server/server_config.toml
#
# Здесь только то, что отличается от апстримовых значений по умолчанию.

[net]
tickrate = 30
port = 1212
# UPnP выключен: проброс сделан вручную на роутере, автоматика тут только мешает.
upnp = false

[game]
hostname = "[RU] Аврора — станцией управляет нейросеть"
desc = "Обычный SS14, но роль Station AI играет не человек, а локальная языковая модель. Она слышит рацию, смотрит в камеры, управляет шлюзами и подчиняется своим законам. Говорите с ней по рации."
soft_max_players = 30
lobbyduration = 150

[chat]
# Раскрытие в лоб, при входе. Не потому что этого требуют правила хаба — они не требуют, —
# а потому что это суть сервера, и экипаж должен понимать, с чем имеет дело. Заодно сразу
# объясняет главное ограничение ИИ, иначе игроки будут кричать в камеру и удивляться молчанию.
motd = "Роль Станционного ИИ на этом сервере ведёт языковая модель, а не игрок. Она слышит только рацию и речь рядом со своим ядром: через камеры она видит, но не слышит. Обращайтесь по рации, она отвечает."

[status]
# ВАЖНО: это UDP-адрес, по которому лаунчер будет подключаться после того, как прочитает
# HTTP-статус. nginx proxy manager проводит только HTTP (TCP) — игровой трафик идёт через
# Lidgren по UDP и через обратный прокси НЕ ходит. Проброс UDP 1212 на роутере обязателен.
connectaddress = "udp://ss14.vnaa.ru:1212"

[hub]
# Пока false. Включение означает публикацию в браузере серверов и вместе с ней обязанности:
# контакты для связи (иначе делистинг без разговора), чистое имя и описание, модерация.
advertise = false
server_url = "ss14s://ss14.vnaa.ru"
hub_urls = "https://hub.spacestation14.com/"

[console]
# Безопасно даже на публичном сервере: AdminManager.IsLocal сравнивает адрес СТРОГО с loopback
# (127.0.0.1 / ::1). Ни внешние игроки, ни машины из локальной сети админку не получают —
# только тот, у кого есть шелл на этой машине.
loginlocal = true

[server]
id = "vnaa_aurora"

[adminlogs]
server_name = "aurora"

[database]
engine = "sqlite"

[log]
level = 2
enabled = false

# ---- LLM Station AI ----
[ai]
enabled = true
endpoint = "http://127.0.0.1:9292/v1"
model = "qwen3.6-27b"
auto_claim = true

# Боевые значения. На отладке стояли 2600/1200/400, чтобы компакция срабатывала за пару минут;
# в бою это привело бы к тому, что ИИ сворачивает историю каждые несколько ходов и забывает смену.
tick_seconds = 8.0
compact_high = 90000
compact_low = 45000
compact_keep_tail = 30000
