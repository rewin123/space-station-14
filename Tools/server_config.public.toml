# Публичная конфигурация сервера «Аксиома».
#
# ЭТО ИСТОЧНИК ИСТИНЫ для всего, что можно держать в git. Рабочий файл —
# /home/rewin/ss14-watchdog/instances/aksioma/config.toml (сервер поднимает вотчдог и
# передаёт ему --config-file). bin/Content.Server/server_config.toml теперь НЕ читается
# боевым сервером — только тем, что запускают из каталога сборки вручную.
#
# КОПИРОВАТЬ ПОВЕРХ НЕЛЬЗЯ. В рабочем файле лежат секреты, которых здесь нет и не будет:
# ключ модели (ai.api_key) и токен отладочной шины (ai.debug_token). `cp` поверх — это тихая
# потеря обоих, после которой сервер поднимется, а ИИ молча не заработает. Правки переносите
# по строкам.
#
# Здесь только то, что отличается от апстримовых значений по умолчанию.

[net]
tickrate = 30
port = 1212
# UPnP выключен: проброс сделан вручную на роутере, автоматика тут только мешает.
upnp = false

# Не грузить development-пресет.
#
# Он лежит в Resources/ConfigPresets/Build/development.toml и подхватывается автоматически
# в любой сборке с TOOLS, то есть в той, которой мы и запускаем сервер. Загружается он как
# ЗНАЧЕНИЯ ПО УМОЛЧАНИЮ, поэтому всё, что здесь не задано явно, приезжало оттуда:
#
#   lobbyenabled = false  — раунд стартует сам при нуле игроков, а первый зашедший приходит
#                           в уже идущую смену без лобби и выбора персонажа;
#   map = "Dev"           — вместо станции загружалась карта для разработки;
#   пресет "sandbox"      — при выключенном лобби GameTicker жёстко берёт песочницу
#                           (GameTicker.GamePreset.cs:108), то есть режима игры нет вовсе:
#                           ни предателей, ни ядерных оперативников. Половина законов ИИ
#                           существует ради ситуаций, которых при песочнице не бывает;
#   events.enabled = false, shuttle.emergency = false, shuttle.arrivals = false — смена не
#                           заканчивается, эвакуации нет, прибытия нет;
#   net.max_ip_connections = 413 — на публичном сервере это открытая дверь.
#
# Одна строка снимает всё это разом. Явные значения ниже пресет всё равно перебивали — но
# полагаться на это опасно: любое поле, которое здесь забудут, тихо возьмётся из dev.
[config]
preset_development = false

[game]
# Явно, а не «и так по умолчанию true»: сломалось именно это значение, и один раз оно уже
# приехало из пресета незамеченным.
lobbyenabled = true
hostname = "[RU] Аксиома — станцией управляет нейросеть"
# «Локальная» отсюда убрана намеренно: модель хостед, и правило хаба 1.7 запрещает сообщать
# о сервере неверные сведения. Конкретную модель не называем — она сменится, а описание нет.
desc = "Обычный SS14, но роль Station AI играет не человек, а языковая модель. Она слышит рацию, смотрит в камеры, управляет шлюзами и подчиняется своим законам. Говорите с ней по рации."
soft_max_players = 30
lobbyduration = 150

[chat]
# Раскрытие в лоб, при входе. Не потому что этого требуют правила хаба — они не требуют, —
# а потому что это суть сервера, и экипаж должен понимать, с чем имеет дело. Заодно сразу
# объясняет главное ограничение ИИ, иначе игроки будут кричать в камеру и удивляться молчанию.
motd = "Роль Станционного ИИ на этом сервере ведёт языковая модель, а не игрок. Она слышит только рацию и речь рядом со своим ядром: через камеры она видит, но не слышит. Обращайтесь по рации, она отвечает."

[status]
# ПУСТО НАМЕРЕННО.
#
# Когда значение пустое, лаунчер выводит UDP-адрес из того, по которому он только что прочитал
# HTTP-статус. Благодаря этому один и тот же сервер работает сразу по всем адресам: по Tailscale
# (100.125.32.120 или ubuntu-xeon.tailf8ac86.ts.net), по локальной сети (192.168.31.250) и по
# localhost. Любое конкретное значение здесь сломало бы все пути, кроме одного.
#
# Заполнять это нужно только если HTTP-статус проксируется отдельно от игрового порта —
# например через Nginx Proxy Manager на публичном домене.
connectaddress = ""

[hub]
# ВКЛЮЧЕНО 2026-08-07. Сервер виден в браузере серверов, регистрация подтверждена как логом
# (`hub: Successfully advertised`), так и запросом к самому хабу.
#
# Вместе с видимостью приехали обязанности из правил хаба: доступные контакты (без них
# делистят без разговора — см. infolinks ниже), честные сведения о сервере, модерация.
# Три активных страйка = снятие навсегда.
#
# Переключать ТОЛЬКО ОДНОВРЕМЕННО с whitelist.enabled ниже. Хаб при включённом вайтлисте —
# худшее первое впечатление, какое можно устроить: сервер виден, зайти нельзя.
advertise = true

# Домен, а не голый IP: с пустым значением хаб выводит адрес через ipify, и листинг ломается
# при смене IP. Схема ss14:// — это http, статус отдаётся тем же портом без TLS.
server_url = "ss14://vnaa.ru:1212"

# region и lang — факты, и правило хаба требует сообщать их верно. rp:none — заявление о том,
# что отыгрыш не обязателен; если решим иначе, менять здесь: rp:low / rp:med / rp:high.
# Лаунчер и так выведет lang:ru из «[RU]» в имени, но полагаться на вывод по имени не стоит.
tags = "region:eu_e,lang:ru,rp:none"

hub_urls = "https://hub.spacestation14.com/"

[console]
# Безопасно даже на публичном сервере: AdminManager.IsLocal сравнивает адрес СТРОГО с loopback
# (127.0.0.1 / ::1). Ни внешние игроки, ни машины из локальной сети админку не получают —
# только тот, у кого есть шелл на этой машине.
loginlocal = true

# СНЯТО, и это не оговорка.
#
# Изначально в таблице admin было НОЛЬ записей, а loginlocal раздаёт хост только с петли —
# то есть админки не было ни у кого, кто играет не с самого сервера. Эта строка была дверью
# внутрь. Теперь rewin123 заведён в базе по-настоящему: ранг Host со всеми 23 флагами.
#
# Пока строка стояла, AdminManager отдавал хост по ней (AdminManager.cs:433) и до базы просто
# не доходил — значит запись в базе не была проверена ни разу, и «админка работает» ничего о
# ней не говорило. Сверять сравнением по ИМЕНИ СЕССИИ то, для чего есть аккаунт, — плохая
# опора на публичном сервере, и апстрим сам просит пользоваться этим только временно.
#
# Восстановить, если что-то пойдёт не так: вернуть "rewin123" и перезапустить ss14-aksioma.
# Дальше админов заводить через F7 -> Permissions Panel, а не правкой базы руками.
login_host_user = ""

[whitelist]
# СНЯТ 2026-08-07, одновременно с включением хаба. Сервер открыт для всех.
#
# Ступенчатый запуск из плана (10 приглашённых -> замеры -> 20 -> 50) пропущен сознательно,
# решением владельца: цель — за сутки увидеть, сколько людей придёт само и что сломается.
# Значит этап 3 (производительность) встречает нагрузку неотрепетированным, и деградация
# тика на двадцати с лишним игроках — ожидаемый исход, а не неожиданность.
#
# Возвращать ТОЛЬКО ОДНОВРЕМЕННО с hub.advertise = false, иначе сервер останется виден тем,
# кого он не пускает.
#
#   whitelistadd <ник>     — впустить
#   whitelistremove <ник>  — выгнать
#
# Пустой вайтлист при enabled = true не пускает НИКОГО: basicWhitelist это
# ConditionManualWhitelistMembership(Allow) + ConditionAlwaysMatch(Deny).
enabled = false

# Контакты для правил хаба.
#
# «If we are unable to contact you we may be forced to go immediately to delisting» — в обход
# системы страйков. Поэтому важно не наличие строки, а живость ссылки: инвайт Discord по
# умолчанию протухает через 7 дней, и протухший считается отсутствующим.
[infolinks]
discord = "https://discord.gg/XshSGMpAH"
website = ""

[admin]
# Считать админов в числе игроков, которое видят хаб и лаунчер.
#
# Апстримовое значение — false, и оно вычитает активных админов из счётчика
# (`GameTicker.StatusShell.cs:47`: `PlayerCount - ActiveAdmins.Count()`). Смысл там разумный:
# сервер, где три админа сидят в пустоте, не должен выглядеть населённым.
#
# У нас задача обратная. Админ ровно один, он же владелец, и он играет. При false сервер
# показывал в хабе НОЛЬ, пока на нём шёл раунд с живым человеком, — а на ноль из браузера
# серверов никто не заходит. Для сервера, который только что появился в листинге, это
# захлопывает единственный канал притока.
#
# Правилам хаба не противоречит: они требуют не занижать и не завышать, а тут человек
# действительно играет. Обратная сторона — когда админ заходит поадминить, а не играть,
# счётчик покажет игрока, которого для игры нет. При одном админе это терпимо; если админов
# станет несколько, значение стоит пересмотреть.
admins_count_in_playercount = true

[server]
id = "vnaa_aksioma"

[adminlogs]
# Переименование добавляет НОВУЮ строку в таблицу `server`, а не правит старую.
#
# На момент смены имени там уже лежали `unknown` (id 0) и `aurora` (id 1), а на `aurora`
# висели 42 раунда и 79406 записей `admin_log`. Они никуда не делись и остались доступны,
# но под прежней меткой: запросы истории за раунды до переименования надо делать по `aurora`,
# за последующие — по `aksioma`. Ничего не потеряно, просто история разрезана надвое.
server_name = "aksioma"

[database]
engine = "sqlite"

[log]
level = 2
# ВКЛЮЧЕНО 2026-08-11. Было false, и разбор зависания клиентов пришлось вести по консольному
# выводу, в котором нет ни одной метки времени: хронологию восстанавливали по журналу агента,
# сопоставляя ходы нейросети с серверными тиками. Файл с временем стоит дешевле такой археологии.
enabled = true

# ---- LLM Station AI ----
[ai]
enabled = true
# Хостед DeepSeek, а не локальная модель. Ключ — только в рабочем файле, см. шапку.
endpoint = "https://api.deepseek.com/v1"
model = "deepseek-v4-flash"
auto_claim = true

# Имя станции на всех картах.
#
# В ваниле его собирает генератор из прототипа карты — «TG Box Station 14-Alpha», —
# и меняется оно с каждой картой в ротации. Для сервера, где станция часть его лица,
# это значит, что лица нет: экипаж каждую смену прилетает куда-то ещё, а объявления
# Центрального командования адресованы каждый раз новому месту.
# Пустое значение возвращает ванильное поведение.
station_name = "Аксиома"

# НИЧЕГО БОЛЬШЕ ЗДЕСЬ НЕ ЗАДАЁМ. Это не лень, а разбор аварии 2026-08-11.
#
# Здесь стояли tick_seconds = 8.0, compact_low = 45000 и compact_keep_tail = 30000, а в рабочем
# файле сверх того max_tokens = 3000. Все четыре значения пережили правку кода и продолжали
# перебивать умолчания из AiCVars, хотя двух последних CVar'ов в коде уже не существует.
# max_tokens = 3000 — это ровно та авария, из-за которой ИИ умирал посреди смены: на большом
# контексте модель тратила весь бюджет на размышления, отдавала пустой ответ, и дальше каждый
# запрос падал с HTTP 400 до конца раунда.
#
# Умолчания в Content.Server/AiAgent/AiCVars.cs теперь и есть боевые значения:
#   max_tokens = 0 (потолка на ответ нет), tick_seconds = 5, tick_seconds_idle = 25,
#   compact_high = 90000, compact_events = 40, max_tool_calls_per_turn = 90,
#   thinking_effort = "low", look_limit = 300.
# Дублировать их тут — значит завести вторую точку правды, которая молча разойдётся с кодом.
# Переопределять что-то из этого стоит только временно и с датой в комментарии.

# ---- Где это всё живёт ----
#
# Сервер поднимает SS14.Watchdog как пользовательский systemd-юнит ss14-aksioma.service.
# Рабочий файл конфига теперь /home/rewin/ss14-watchdog/instances/aksioma/config.toml,
# база (вайтлист, баны, преференции) — там же в data/. Подробности и команды управления:
# /home/rewin/ss14-watchdog/README.md
#
# Автообновление отключено намеренно: UpdateType не задан, провайдера обновлений нет вовсе.
# Иначе вотчдог затёр бы сборку форка апстримом.
#
# ---- Сборка: только Release ----
#
#     dotnet build SpaceStation14.slnx -c Release
#
# Debug на боевом сервере недопустим, и это не про скорость. DebugTools.Assert помечен
# [Conditional("DEBUG")]: в Release компилятор вырезает вызов, в Debug тот же вызов БРОСАЕТ
# исключение. 2026-08-11 это сработало внутри параллельной джобы физики —
# SharedBroadphaseSystem.FindPairs, генерация контактов, — и оборвало часть работы широкой фазы:
#
#     [ERRO] parallel: Exception in ParallelManager: DebugAssertException
#
# Проверить, что запущено: в консольном логе при старте видно
# `configpreset: Loaded config preset: "/ConfigPresets/Build/debug.toml"` — если эта строка есть,
# собрано Debug. Ещё одна ловушка: MSBuild при копировании в bin сохраняет исходные метки времени,
# поэтому по дате файла конфигурацию не определить — сверяйте хеш с
# RobustToolbox/Robust.Shared/bin/Release/Robust.Shared.dll.
