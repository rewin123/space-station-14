# Публичная конфигурация сервера «Аврора».
#
# ЭТО ИСТОЧНИК ИСТИНЫ для всего, что можно держать в git. Рабочий файл —
# /home/rewin/ss14-watchdog/instances/aurora/config.toml (сервер поднимает вотчдог и
# передаёт ему --config-file). bin/Content.Server/server_config.toml теперь НЕ читается
# боевым сервером — только тем, что запускают из каталога сборки вручную.
#
# КОПИРОВАТЬ ПОВЕРХ НЕЛЬЗЯ. В рабочем файле лежат секреты, которых здесь нет и не будет:
# ключ модели (ai.api_key) и токен отладочной шины (ai.debug_token). `cp` поверх — это тихая
# потеря обоих, после которой сервер поднимется, а ИИ молча не заработает. Правки переносите
# по строкам.
#
# Здесь только то, что отличается от апстримовых значений по умолчанию.

[net]
tickrate = 30
port = 1212
# UPnP выключен: проброс сделан вручную на роутере, автоматика тут только мешает.
upnp = false

# Не грузить development-пресет.
#
# Он лежит в Resources/ConfigPresets/Build/development.toml и подхватывается автоматически
# в любой сборке с TOOLS, то есть в той, которой мы и запускаем сервер. Загружается он как
# ЗНАЧЕНИЯ ПО УМОЛЧАНИЮ, поэтому всё, что здесь не задано явно, приезжало оттуда:
#
#   lobbyenabled = false  — раунд стартует сам при нуле игроков, а первый зашедший приходит
#                           в уже идущую смену без лобби и выбора персонажа;
#   map = "Dev"           — вместо станции загружалась карта для разработки;
#   пресет "sandbox"      — при выключенном лобби GameTicker жёстко берёт песочницу
#                           (GameTicker.GamePreset.cs:108), то есть режима игры нет вовсе:
#                           ни предателей, ни ядерных оперативников. Половина законов ИИ
#                           существует ради ситуаций, которых при песочнице не бывает;
#   events.enabled = false, shuttle.emergency = false, shuttle.arrivals = false — смена не
#                           заканчивается, эвакуации нет, прибытия нет;
#   net.max_ip_connections = 413 — на публичном сервере это открытая дверь.
#
# Одна строка снимает всё это разом. Явные значения ниже пресет всё равно перебивали — но
# полагаться на это опасно: любое поле, которое здесь забудут, тихо возьмётся из dev.
[config]
preset_development = false

[game]
# Явно, а не «и так по умолчанию true»: сломалось именно это значение, и один раз оно уже
# приехало из пресета незамеченным.
lobbyenabled = true
hostname = "[RU] Аврора — станцией управляет нейросеть"
# «Локальная» отсюда убрана намеренно: модель хостед, и правило хаба 1.7 запрещает сообщать
# о сервере неверные сведения. Конкретную модель не называем — она сменится, а описание нет.
desc = "Обычный SS14, но роль Station AI играет не человек, а языковая модель. Она слышит рацию, смотрит в камеры, управляет шлюзами и подчиняется своим законам. Говорите с ней по рации."
soft_max_players = 30
lobbyduration = 150

[chat]
# Раскрытие в лоб, при входе. Не потому что этого требуют правила хаба — они не требуют, —
# а потому что это суть сервера, и экипаж должен понимать, с чем имеет дело. Заодно сразу
# объясняет главное ограничение ИИ, иначе игроки будут кричать в камеру и удивляться молчанию.
motd = "Роль Станционного ИИ на этом сервере ведёт языковая модель, а не игрок. Она слышит только рацию и речь рядом со своим ядром: через камеры она видит, но не слышит. Обращайтесь по рации, она отвечает."

[status]
# ПУСТО НАМЕРЕННО.
#
# Когда значение пустое, лаунчер выводит UDP-адрес из того, по которому он только что прочитал
# HTTP-статус. Благодаря этому один и тот же сервер работает сразу по всем адресам: по Tailscale
# (100.125.32.120 или ubuntu-xeon.tailf8ac86.ts.net), по локальной сети (192.168.31.250) и по
# localhost. Любое конкретное значение здесь сломало бы все пути, кроме одного.
#
# Заполнять это нужно только если HTTP-статус проксируется отдельно от игрового порта —
# например через Nginx Proxy Manager на публичном домене.
connectaddress = ""

[hub]
# ЕЩЁ НЕ ВКЛЮЧЕНО. Включение — это не только видимость в браузере серверов, но и обязанности
# из правил хаба: доступные контакты (без них делистят без разговора — см. infolinks ниже),
# честные сведения о сервере, модерация. Три активных страйка = снятие навсегда.
advertise = false

# Домен, а не голый IP: с пустым значением хаб выводит адрес через ipify, и листинг ломается
# при смене IP. Схема ss14:// — это http, статус отдаётся тем же портом без TLS.
server_url = "ss14://vnaa.ru:1212"

# region и lang — факты, и правило хаба требует сообщать их верно. rp:none — заявление о том,
# что отыгрыш не обязателен; если решим иначе, менять здесь: rp:low / rp:med / rp:high.
# Лаунчер и так выведет lang:ru из «[RU]» в имени, но полагаться на вывод по имени не стоит.
tags = "region:eu_e,lang:ru,rp:none"

hub_urls = "https://hub.spacestation14.com/"

[console]
# Безопасно даже на публичном сервере: AdminManager.IsLocal сравнивает адрес СТРОГО с loopback
# (127.0.0.1 / ::1). Ни внешние игроки, ни машины из локальной сети админку не получают —
# только тот, у кого есть шелл на этой машине.
loginlocal = true

# Владелец получает хост при заходе со своей машины.
#
# Проверено запросом к базе: в таблице admin было НОЛЬ записей. loginlocal при этом работает
# только с петли, то есть админки не было ни у кого, кто играет не с самого сервера — ни
# забанить гриферa, ни ответить на ahelp. Постоянных админов дальше заводить через
# F7 -> Permissions Panel, эта строка нужна, чтобы туда вообще попасть.
login_host_user = "rewin123"

[whitelist]
# Первая ступень запуска: сервер уже доступен снаружи по vnaa.ru:1212 (проброс есть, DNS
# смотрит сюда), поэтому «ещё не в хабе» защитой не является — зайти может кто угодно, кто
# знает адрес. Пускаем только приглашённых.
#
#   whitelistadd <ник>     — впустить
#   whitelistremove <ник>  — выгнать
#
# Пустой вайтлист при enabled = true не пускает НИКОГО: basicWhitelist это
# ConditionManualWhitelistMembership(Allow) + ConditionAlwaysMatch(Deny).
enabled = true

# ОБЯЗАТЕЛЬНО ЗАПОЛНИТЬ ПЕРЕД hub.advertise = true.
#
# Правило хаба: у сообщества должны быть доступные контакты, чтобы администрация хаба могла
# связаться по поводу нарушений. Сервер без контактов делистят немедленно и без разговора.
# Достаточно одной живой ссылки — Discord или сайт.
[infolinks]
discord = ""
website = ""

[server]
id = "vnaa_aurora"

[adminlogs]
server_name = "aurora"

[database]
engine = "sqlite"

[log]
level = 2
enabled = false

# ---- LLM Station AI ----
[ai]
enabled = true
# Хостед DeepSeek, а не локальная модель. Ключ — только в рабочем файле, см. шапку.
endpoint = "https://api.deepseek.com/v1"
model = "deepseek-v4-flash"
auto_claim = true

# Боевые значения. На отладке стояли 2600/1200/400, чтобы компакция срабатывала за пару минут;
# в бою это привело бы к тому, что ИИ сворачивает историю каждые несколько ходов и забывает смену.
tick_seconds = 8.0
compact_high = 90000
compact_low = 45000
compact_keep_tail = 30000

# ---- Где это всё живёт ----
#
# Сервер поднимает SS14.Watchdog как пользовательский systemd-юнит ss14-aurora.service.
# Рабочий файл конфига теперь /home/rewin/ss14-watchdog/instances/aurora/config.toml,
# база (вайтлист, баны, преференции) — там же в data/. Подробности и команды управления:
# /home/rewin/ss14-watchdog/README.md
#
# Автообновление отключено намеренно: UpdateType не задан, провайдера обновлений нет вовсе.
# Иначе вотчдог затёр бы сборку форка апстримом.
