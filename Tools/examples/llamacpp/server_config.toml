# ПРИМЕР: секция [ai] под локальную модель на llama.cpp.
#
# Куда класть: в config.toml инстанса (вотчдог) или в bin/Content.Server/server_config.toml
# (разработка). Не копируйте файл целиком — возьмите нужные ключи.
#
# ГРАНИЦА МЕЖДУ ЭТИМ ФАЙЛОМ И config.d/*.yml, и она не формальная:
#
#   config.toml     — рубильники и то, что меняют командой на живом сервере (`cvar ai.llm_chain …`).
#                     Одно значение на ключ, без структуры.
#   config.d/*.yml  — прототипы: профили провайдеров, правила режимов, пресеты, пулы. Всё, у чего
#                     есть поля.
#
# Правило простое: КТО отвечает — здесь, КАК он устроен — в YAML.

[ai]
# Главный рубильник. Без него сборка не обращается в сеть вовсе — это умолчание кода, и оно
# сознательное: свежеклонированный форк не должен звонить наружу.
enabled = true

# Абсолютный путь. Пустое значение резолвится как <каталог exe>/../../ai_data, и если bin —
# символьная ссылка, ответ зависит от того, разворачивает ли .NET симлинк. Разворачивает, но
# ставить на это память агента и ключи незачем: ошибка выглядела бы как «ИИ забыл всё», без
# единой строки в журнале.
#
# Накладка ищется здесь же: <data_dir>/config.d/*.yml
data_dir = "/absolute/path/to/ai_data"

# ЦЕПОЧКА ПРОВАЙДЕРОВ — главная операционная ручка.
#
# Слева направо: первый живой отвечает, остальные подхватывают отказ. Здесь: своё железо, и
# только оно.
#
# Меняется на живом сервере командой `cvar ai.llm_chain "llamacpp,deepseek"` — именно поэтому
# порядок задаётся ключом, а не полем прототипа: когда голова цепочки ложится посреди вечера,
# откат обязан быть строкой в консоли, а не пересборкой с киком всех игроков.
#
# ПУСТОЕ ЗНАЧЕНИЕ — рабочий режим, а не «не настроено»: тогда агент идёт по одиночному
# ai.endpoint/ai.model ниже, как до появления профилей. Это и есть последний откат.
llm_chain = "llamacpp"

# Бюджет ВСЕГО хода на ВСЮ цепочку, секунды.
#
# ОБЯЗАН БЫТЬ БОЛЬШЕ, чем timeoutSeconds каждого звена, кроме последнего. Иначе голова, зависнув
# на своём таймауте, съедает бюджет целиком, следующее звено не пробуется вовсе, и ход теряется
# полностью. Так 01.09.2026 ИИ молчал четыре минуты подряд: у профиля стояло 240 при бюджете 240.
#
# С одним локальным звеном на 600 секунд это число обязано быть не меньше 600.
# Сверяет `aiagent llm probe`.
llm_total_timeout = 660

# Одиночный эндпоинт: запасной путь на случай пустой цепочки. Диалект здесь не настраивается —
# он выводится по адресу, и всё, кроме deepseek.com, получает набор полей llama.cpp.
endpoint = "http://127.0.0.1:8080/v1"
model = "local-model"

# Потолок одновременно живых агентов — ядро и киборги вместе.
#
# Считайте от числа слотов llama-server (--parallel): агенты сверх слотов вытесняют префикс-кэш
# друг друга, и каждый ход становится полным prefill. Восемь агентов на трёх слотах — это не
# «немного медленнее», это разница в разы.
max_agents = 3

# Печатный порог свёртки — для профилей, у которых нет своего compactHigh. У llamacpp он есть,
# так что это значение ему не достанется; держится осмысленным на случай нового профиля,
# заведённого второпях.
compact_high = 96000

# Накладка config.d. Выключать стоит ровно в одном случае: когда сервер ведёт себя не так, как
# написано в Resources/, и надо ОТЛИЧИТЬ правку накладки от правки кода.
config_overlay = true
