# ПРИМЕР: перенастроить режимы, не трогая репозиторий.
#
# Куда класть: ai_data/config.d/20-modes.yml
#   cp Tools/examples/llamacpp/20-modes.yml ai_data/config.d/
#
# Нумерация файлов не косметика: накладка читает config.d/*.yml по алфавиту, и если два файла
# трогают один прототип, побеждает последний. С 10-, 20-, 30- порядок перестаёт быть
# случайностью, как только файлов становится больше двух.
#
# ЧТО ЗДЕСЬ МОЖНО, А ЧЕГО НЕЛЬЗЯ
#
# Можно: заменить любой прототип форка целиком — правило режима, пресет, пул секрета, профиль
# модели. Нельзя: изменить ОДНО поле. Запись с существующим id замещает прототип, а не сливается
# с ним; неуказанные поля вернутся к умолчаниям типа, а не к значениям из Resources/. Поэтому
# ниже каждое правило выписано полностью, а не «только то, что поменялось».
#
# Применить: `aiagent config reload`. Правила раунда подхватятся СЛЕДУЮЩИМ раундом — живое
# правило получило свои поля в момент старта смены.
# Посмотреть, что получилось: `aiagent mode`.

# ---------------------------------------------------------------- свой режим на своей модели
#
# Мирная смена, но модель — локальная, из 10-endpoints.yml. Ровно то, ради чего накладка и
# заведена: «этот сервер играет на своём железе» — свойство сервера, а не форка.
#
# Правило — то же самое RogueAiRule, что у злых режимов. Злым его делают ЗНАЧЕНИЯ, а не тип:
# законы, файл личности, раздача доступа. Здесь законы штатные, доступ не раздаётся.
- type: entity
  parent: BaseGameRule
  id: AiLocalPeacefulRule
  components:
  - type: RogueAiRule
    lawset: Crewsimov
    soulFile: SOUL.md
    # Одна своя модель и НИ ОДНОГО фаллбека — сознательно: цель этого режима в том, чтобы играть
    # на своём железе, а тихий уход на облачное звено превратил бы проверку в «кажется, работает».
    # Для боевого сервера так делать не стоит: упавший llama-server оставит смену без ИИ.
    llmChain: llamacpp
    allJobsPassenger: false
    announceOnStart: false
    grantDoors: false
    grantConsoles: false
    grantTurrets: false
    # Смерть ИИ не заканчивает смену: он тут член экипажа, а не антагонист, и завершать раунд его
    # гибелью значило бы дать любому желающему кнопку «конец раунда».
    endsRoundOnAiDeath: false
    supportBorgs:
    - AiBorgChassis
    # НЕ «любой маяк»: пустое значение означает первый попавшийся, а первым попадается ядро ИИ —
    # и киборг встанет в запертой комнате, из которой не выйдет. Порядок от частного к общему.
    supportBorgBeacons:
    - Robotics
    - Science
    - Arrivals

- type: gamePreset
  id: AiLocal
  alias:
  - local
  - свой
  name: ai-peaceful-title
  description: ai-peaceful-description
  showInVote: true
  rules:
  - AiLocalPeacefulRule
  # Без этих двух смена пустая: на станции не происходит вообще ничего, кроме ИИ, и полтора часа
  # тишины складываются в единственное развлечение — ждать, когда он что-нибудь сделает.
  - RampingStationEventScheduler
  - BasicRoundstartVariation

# ------------------------------------------------------------------------ свой секретный пул
#
# Замещает SecretAksioma из Resources/. Смысл именно в замещении: пул — это «что играет вечером
# на ЭТОМ сервере», то есть настройка инстанса, а не свойство форка.
#
# ЛОВУШКА, КОТОРУЮ ЛЕГКО НЕ ЗАМЕТИТЬ. Порог по игрокам считается как МАКСИМУМ по всем правилам
# пресета (GameTicker.GetMinimumPlayerCount), и его втаскивает любое добавленное правило, не
# только антагонистическое. Пул, у всех режимов которого есть порог, на пустом сервере не
# выбирает НИЧЕГО, и раунд не начинается вовсе — молча, без строки в журнале. Держите в пуле хотя
# бы один режим без minPlayers.
#
# Проверить состав и достижимость: `dotnet test --filter SecretPoolTests`.
- type: weightedRandom
  id: SecretAksioma
  weights:
    Traitor: 1.0
    AiLocal: 1.0
