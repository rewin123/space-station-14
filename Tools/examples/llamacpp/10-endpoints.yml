# ПРИМЕР: своя модель на llama.cpp как основной провайдер агента.
#
# Куда класть: ai_data/config.d/10-endpoints.yml
#   cp Tools/examples/llamacpp/10-endpoints.yml ai_data/config.d/
#
# Каталог ai_data/ перечислен в .gitignore и НЕ раздаётся игрокам — в отличие от Resources/,
# которую ContentMagicAczProvider отдаёт целиком каждому подключившемуся. Поэтому настройки
# конкретного сервера живут здесь, а не в репозитории: правка не станет коммитом, не будет
# конфликтовать при подтягивании форка и не уедет в клиент.
#
# Формат — обычный прототипный YAML, тот же, что в Resources/Prototypes/_AiAgent/. Записи с
# существующим id ЗАМЕЩАЮТ прототип целиком, а не сливаются с ним по полям: перечисляйте все
# нужные поля, иначе неуказанные вернутся к умолчаниям типа, а не к значениям из Resources/.
#
# Применить: `aiagent config reload` в консоли сервера (или перезапуск).
# Проверить: `aiagent config`, затем `aiagent llm probe llamacpp`.

# ------------------------------------------------------------------ основная локальная модель
#
# Считает, что llama-server поднят скриптом llama-server.sh из этого же каталога.
- type: aiLlmProfile
  id: llamacpp
  endpoint: http://127.0.0.1:8080/v1
  # То, что llama-server сообщает в /v1/models. По умолчанию это ИМЯ ФАЙЛА весов без пути,
  # и почти всегда не то, что вы ожидали. Скрипт запуска задаёт его явно флагом --alias, а
  # `aiagent llm probe` сверяет здешнее значение со списком провайдера и ругается на расхождение.
  model: local-model

  # LlamaCpp, а не OpenAiCompat, и это не мелочь.
  #
  # Диалект решает, какие поля уйдут в тело запроса. У llama.cpp легальны top_k, min_p,
  # cache_prompt и id_slot — расширения, которых у OpenAI нет; строгий эндпоинт отвечает на них
  # 400. Обратное тоже верно: reasoning_effort верхнего уровня llama-server принимает и МОЛЧА
  # игнорирует, поэтому здесь его слать бессмысленно (см. reasoningEffort ниже).
  #
  # ВНИМАНИЕ: если за этим адресом стоит vLLM или SGLang, а не llama-server, диалект обязан быть
  # OpenAiCompat — они строгие и на четырёх лишних полях отвечают отказом на каждом ходу.
  dialect: LlamaCpp

  # Своё железо: счёт не выставляется, и в `aiagent cost` эта строка обязана быть нулём.
  # Metered здесь означал бы выдуманные деньги в разборе раунда.
  quota: Free

  # ОБЯЗАТЕЛЬНО None для loopback.
  #
  # Машина может экспортировать HTTP_PROXY/ALL_PROXY глобально, и запрос на 127.0.0.1, ушедший
  # в прокси, не отваливается с ошибкой, а ЗАВИСАЕТ до таймаута. Это самая частая причина
  # «curl работает, а сервер молчит».
  proxy: None

  # Спросить у llama-server настоящий n_ctx через /props. Единственный провайдер, который умеет
  # ответить на этот вопрос; всем остальным приходится верить на слово в ctxLimit.
  #
  # Смысл в том, что перезапуск llama-server с другим -c МОЛЧА разъезжается с порогом свёртки:
  # агент компактится по старому числу, а окно уже другое.
  ctxProbe: Props

  # Запасное число на случай, если /props не ответил. Держите его равным -c из скрипта запуска.
  ctxLimit: 131072

  # Порог свёртки. ОБЯЗАН быть заметно меньше окна, и вот почему: свёртка ждёт закрытия открытых
  # вызовов инструментов, а ход может идти до ai.max_tool_calls_per_turn шагов — то есть между
  # «пора сворачиваться» и «свернулись» промпт успевает подрасти. Зазор в 25-30% — не запас, а
  # рабочая величина.
  compactHigh: 96000

  # Секунды. Большое число здесь законно: модель на своём железе на длинном контексте отвечает
  # десятками секунд, а первый ход после подъёма весов — минутами.
  #
  # НО: если этот профиль стоит в цепочке ai.llm_chain не последним, число обязано быть МЕНЬШЕ
  # ai.llm_total_timeout. Иначе, зависнув, он съест бюджет хода целиком и следующее звено не
  # попробуется вовсе — ход потеряется, а в журнале останется только таймаут. Проверяет
  # `aiagent llm probe`.
  timeoutSeconds: 600

  # llama-server честно сообщает, сколько промпта пришло из кэша. У провайдера, который этого не
  # умеет, ставьте false: иначе тревога «префикс-кэш сломан» будет писать ERROR на каждом ходу и
  # обесценит алярм, заведённый ловить настоящую поломку.
  reportsCache: true

  # Пусто НАМЕРЕННО. Уровень размышления у llama.cpp задаётся флагом запуска
  # --chat-template-kwargs, а поле в теле запроса сервер принимает и игнорирует. Значение,
  # которое выглядит рабочим и ничего не делает, хуже отсутствующего.
  reasoningEffort: ""

  # Ключ: имя файла внутри ai_data/, не значение. Нужен, только если llama-server поднят с
  # --api-key. На loopback без ключа строку можно убрать целиком.
  # keyFile: llamacpp.key
